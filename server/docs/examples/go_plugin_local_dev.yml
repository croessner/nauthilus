# Local development without artifact verification.
plugins:
  verification_policy: off
  allowed_dirs:
    - /Users/example/nauthilus-plugin-build
  modules:
    - name: geoip_dev
      type: go
      path: /Users/example/nauthilus-plugin-build/geoip.so
      optional: false
      config:
        decision_bindings:
          - component: environment
            targets: [authn/authenticate, authn/lookup_identity]
            input: {fact: input.auth.client_ip, category: environment}
            output_schema: geoip.facts.v1
        database_path: /Users/example/nauthilus-plugin-build/geoip.json
        refresh_interval: 10s
        lookup_timeout: 50ms
