  /api/v1/policy/decisions:
    post:
      tags:
        - Policy
      operationId: evaluatePolicyDecision
      summary: Evaluate one Policy decision.
      description: >
        Evaluates exactly one admitted Policy request. Responses are never
        cacheable and do not expose retry, replay, cache, or outcome-reporting
        controls.
      security:
        - policyBearer: []
        - policyBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDecisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/PolicyDecision"
        "400":
          $ref: "#/components/responses/PolicyBadRequest"
        "401":
          $ref: "#/components/responses/PolicyUnauthorized"
        "403":
          $ref: "#/components/responses/PolicyForbidden"
        "413":
          $ref: "#/components/responses/PolicyRequestTooLarge"
        "415":
          $ref: "#/components/responses/PolicyUnsupportedMediaType"
        "429":
          $ref: "#/components/responses/PolicyRateLimited"
        "503":
          $ref: "#/components/responses/PolicyUnavailable"
  /api/v1/openapi.yaml:
    get:
      tags:
        - OpenAPI
      operationId: getOpenAPIYAML
      summary: Get the OpenAPI document as YAML.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      responses:
        "200":
          description: OpenAPI document in YAML format.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/openapi.json:
    get:
      tags:
        - OpenAPI
      operationId: getOpenAPIJSON
      summary: Get the OpenAPI document as JSON.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      responses:
        "200":
          description: OpenAPI document in JSON format.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/auth/json:
    get:
      tags:
        - Authentication
      operationId: getJSONAuth
      summary: Run the JSON authentication endpoint without a JSON body.
      description: >
        The GET form is primarily used for account listing or no-auth probes via
        the mode query parameter.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - $ref: "#/components/parameters/AuthMode"
        - $ref: "#/components/parameters/InMemoryFlag"
        - $ref: "#/components/parameters/CacheFlag"
      responses:
        "200":
          $ref: "#/components/responses/AuthJSONSuccess"
        "400":
          $ref: "#/components/responses/JSONValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Authentication
      operationId: postJSONAuth
      summary: Authenticate with a strict JSON request body.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - $ref: "#/components/parameters/AuthMode"
        - $ref: "#/components/parameters/InMemoryFlag"
        - $ref: "#/components/parameters/CacheFlag"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthJSONSuccess"
        "400":
          $ref: "#/components/responses/JSONValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/auth/cbor:
    get:
      tags:
        - Authentication
      operationId: getCBORAuth
      summary: Run the CBOR authentication endpoint without a CBOR body.
      description: >
        The GET form is primarily used for account listing or no-auth probes via
        the mode query parameter. List-account responses negotiate the response
        content type from the Accept header.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - $ref: "#/components/parameters/AuthMode"
        - $ref: "#/components/parameters/InMemoryFlag"
        - $ref: "#/components/parameters/CacheFlag"
