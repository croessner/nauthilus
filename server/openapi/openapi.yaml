          $ref: "#/components/responses/SupportOperationsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SupportOperationsForbidden"
        "429":
          $ref: "#/components/responses/SupportOperationsBusy"
        "500":
          $ref: "#/components/responses/SupportOperationsInternal"
        "503":
          $ref: "#/components/responses/SupportOperationsUnavailable"
  /api/v1/support/responses/segment:
    post:
      tags:
        - SupportOperations
      operationId: readSupportResponseSegment
      summary: Return the next segment of a support answer that exceeded the transport size bound.
      description: >-
        Requires a support scope of the operation that produced the answer, and the same principal. An answer above
        a transport bound (today the MCP limits.max_response_bytes) is returned as a segment instead of being
        discarded: concatenating `data` of every segment in order, following `segment.next_cursor` until it is null,
        yields the complete JSON answer byte for byte. Segments expire after ten minutes (`SEGMENT_UNKNOWN`; repeat
        the original call). Nothing is changed.
      security:
        - backchannelBearer: []
        - backchannelBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportResponseSegmentRequest"
      responses:
        "200":
          description: One segment.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SupportHistoryNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportResponseSegmentResponse"
        "400":
          $ref: "#/components/responses/SupportOperationsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SupportOperationsForbidden"
        "404":
          description: The segment is unknown or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportOperationsError"
components:
  headers:
    SupportHistoryNoStore:
      description: Support history answers are never cached.
      schema:
        type: string
        const: no-store
  securitySchemes:
    policyBasic:
      type: http
      scheme: basic
      description: Dedicated Policy client credentials; never management Basic credentials.
    policyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Policy-resource Bearer token with nauthilus:policy_evaluate scope.
    backchannelBasic:
      type: http
      scheme: basic
      description: >-
        Backchannel Basic authentication. The unrestricted credential (auth.backchannel.basic_auth.username) passes
        every management scope check and holds no support scope. A scoped credential
        (auth.backchannel.basic_auth.users) is authorized like a bearer token carrying the scopes configured for it.
    backchannelBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Backchannel OIDC bearer token. Every route family asks for its own scopes: nauthilus:authenticate for the
        authentication endpoints and these OpenAPI documents, nauthilus:security_read for brute-force and OIDC
        session listings, nauthilus:security_write for cache and brute-force flushes and OIDC session deletion
        (either of them for the status of an asynchronous job), the MFA and WebAuthn scopes for the MFA backchannel,
        and the support scopes for /api/v1/support. nauthilus:security includes both security scopes, and
        nauthilus:admin is accepted on the security and MFA routes as well; neither opens the authentication
        endpoints or the support routes.
  parameters:
    AuthMode:
      name: mode
      in: query
      required: false
      schema:
        type: string
        enum:
          - no-auth
          - list-accounts
      description: Optional authentication operation mode.
    InMemoryFlag:
      name: in-memory
      in: query
      required: false
      schema:
        type: string
        enum:
          - "0"
      description: Disable in-memory monitoring for this request when set to 0.
    CacheFlag:
      name: cache
      in: query
      required: false
      schema:
        type: string
        enum:
          - "0"
      description: Disable cache monitoring for this request when set to 0.
    AuthUserHeader:
      name: Auth-User
      in: header
      required: false
      schema:
        type: string
      description: Username header. Required for authentication unless mode is no-auth or list-accounts.
    AuthPassHeader:
      name: Auth-Pass
      in: header
      required: false
      schema:
        type: string
        format: password
      description: Password header. The configured header is removed from the request after it is read.
    AuthPasswordEncodedHeader:
      name: X-Auth-Password-Encoded
      in: header
      required: false
      schema:
        type: string
        enum:
          - "1"
      description: Set to 1 when Auth-Pass carries URL-safe base64 encoded password bytes.
    AuthProtocolHeader:
      name: Auth-Protocol
      in: header
      required: false
      schema:
        type: string
        enum:
          - smtp
          - imap
          - pop3
      description: Mail protocol of the upstream authentication attempt.
    AuthMethodHeader:
      name: Auth-Method
      in: header
      required: false
      schema:
        type: string
      description: Authentication mechanism such as LOGIN or PLAIN.
    AuthLoginAttemptHeader:
      name: Auth-Login-Attempt
      in: header
      required: false
      schema:
        type: integer
        minimum: 0
      description: One-based login attempt hint from the caller.
    ClientIPHeader:
      name: Client-IP
      in: header
      required: false
      schema:
        type: string
      description: Client source IP address.
    ClientPortHeader:
      name: X-Client-Port
      in: header
      required: false
      schema:
        type: string
      description: Client source TCP port.
    ClientIDHeader:
      name: X-Client-ID
      in: header
      required: false
      schema:
        type: string
      description: Optional upstream client identifier.
    ClientHostHeader:
      name: X-Client-Host
      in: header
      required: false
      schema:
        type: string
      description: Optional upstream client hostname.
    ExternalSessionIDHeader:
      name: X-External-Session-ID
      in: header
      required: false
      schema:
        type: string
      description: Optional upstream session correlation identifier.
    LocalIPHeader:
      name: X-Local-IP
      in: header
      required: false
      schema:
        type: string
      description: Local listener IP address.
    LocalPortHeader:
      name: X-Auth-Port
      in: header
      required: false
      schema:
        type: string
      description: Local listener TCP port.
    OIDCCIDHeader:
      name: X-OIDC-CID
      in: header
      required: false
      schema:
        type: string
      description: Optional OIDC client identifier associated with the request.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Maximum number of records to return per brute-force list section.
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Zero-based offset for brute-force list paging.
    SSLHeader:
      name: X-SSL
      in: header
      required: false
      schema:
        type: string
      description: SSL/TLS state hint from the caller.
    SSLSessionIDHeader:
      name: X-SSL-Session-ID
      in: header
      required: false
      schema:
        type: string
      description: SSL session identifier.
    SSLClientVerifyHeader:
      name: X-SSL-Client-Verify
      in: header
      required: false
      schema:
        type: string
      description: Client certificate verification status.
    SSLClientDNHeader:
      name: X-SSL-Client-DN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate subject DN.
    SSLClientCNHeader:
      name: X-SSL-Client-CN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate common name.
    SSLIssuerHeader:
      name: X-SSL-Issuer
      in: header
      required: false
      schema:
        type: string
      description: Client certificate issuer.
    SSLClientNotBeforeHeader:
      name: X-SSL-Client-NotBefore
      in: header
      required: false
      schema:
        type: string
      description: Client certificate validity start.
    SSLClientNotAfterHeader:
      name: X-SSL-Client-NotAfter
      in: header
      required: false
      schema:
        type: string
      description: Client certificate validity end.
    SSLSubjectDNHeader:
      name: X-SSL-Subject-DN
      in: header
      required: false
      schema:
        type: string
      description: SSL subject distinguished name.
    SSLIssuerDNHeader:
      name: X-SSL-Issuer-DN
      in: header
      required: false
      schema:
        type: string
      description: SSL issuer distinguished name.
    SSLClientSubjectDNHeader:
      name: X-SSL-Client-Subject-DN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate subject distinguished name.
    SSLClientIssuerDNHeader:
      name: X-SSL-Client-Issuer-DN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate issuer distinguished name.
    SSLCipherHeader:
      name: X-SSL-Cipher
      in: header
      required: false
      schema:
        type: string
      description: TLS cipher suite.
    SSLProtocolHeader:
      name: X-SSL-Protocol
      in: header
      required: false
      schema:
        type: string
      description: TLS protocol version.
    SSLSerialHeader:
      name: Auth-SSL-Serial
      in: header
      required: false
      schema:
        type: string
      description: Client certificate serial number.
    SSLFingerprintHeader:
      name: Auth-SSL-Fingerprint
      in: header
      required: false
      schema:
        type: string
      description: Client certificate fingerprint.
  responses:
    SupportHistoryBadRequest:
      description: Malformed request, window above 31 days, foreign cursor, malformed attempt id, or query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportHistoryError"
    SupportHistoryForbidden:
      description: The verified caller lacks the required history permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportHistoryError"
    SupportHistoryQueryTooBroad:
      description: The read exceeded the server-side budget; narrow the window or add filters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportHistoryError"
    SupportHistoryBusy:
      description: The shared history concurrency gate is full; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportHistoryError"
    SupportHistoryInternal:
      description: Unexpected service failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportHistoryError"
    SupportHistoryUnavailable:
      description: >-
        No history source configured, the primary source could not be read completely, the reader account is not
        read-only or does not enforce budgets, or the time budget expired. Never an empty history.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportHistoryError"
    SupportOperationsBadRequest:
      description: Malformed request, unknown component or source, window above 24 hours, or query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportOperationsError"
    SupportOperationsForbidden:
      description: The verified caller lacks nauthilus:operations_read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportOperationsError"
    SupportOperationsBusy:
      description: The diagnostics concurrency gate is full; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportOperationsError"
    SupportOperationsInternal:
      description: Unexpected service failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportOperationsError"
    SupportOperationsUnavailable:
      description: Operational diagnostics are not configured on this instance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportOperationsError"
    PolicyDecision:
      description: Completed Policy evaluation, including an indeterminate effect when safe to construct.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyDecisionResponse"
    PolicyBadRequest:
      description: Strict JSON or public-field validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyForbidden:
      description: The authenticated Policy caller is not admitted for this request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyRequestTooLarge:
      description: The request or a submitted value exceeded an admitted limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyRateLimited:
      description: The admitted client exceeded concurrency or rate limits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyUnauthorized:
      description: Policy credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyUnsupportedMediaType:
      description: The Policy endpoint accepts application/json only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyUnavailable:
      description: The Policy service was unavailable before evaluation began.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    AuthHeaderFailure:
      description: Header-mode authentication failure. The response body is JSON null; Auth-Status carries the status message.
      headers:
        Auth-Status:
          schema:
            type: string
        Auth-Wait:
          schema:
            type: string
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: "null"
    AuthHeaderSuccess:
      description: >
        Header-mode authentication result. Successful requests return headers
        such as Auth-Status, Auth-User, X-Nauthilus-Session, and dynamic
        X-Nauthilus-* attribute headers.
      headers:
        Auth-Status:
          schema:
            type: string
        Auth-User:
          schema:
            type: string
        X-Nauthilus-Memory-Cache:
          schema:
            type: string
            enum:
              - Hit
              - Miss
        X-Nauthilus-Session:
          schema:
            type: string
    AuthNginxResult:
      description: >
        NGINX auth_http result. HTTP status is 200 for both success and
        authentication failure; Auth-Status carries OK or the failure message.
      headers:
        Auth-Status:
          schema:
            type: string
        Auth-User:
          schema:
            type: string
        Auth-Server:
          schema:
            type: string
        Auth-Port:
          schema:
            type: string
        Auth-Wait:
          schema:
            type: string
        Auth-Error-Code:
          schema:
            type: string
        X-Nauthilus-Memory-Cache:
          schema:
            type: string
            enum:
              - Hit
              - Miss
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: "null"
    AuthJSONSuccess:
      description: Authentication result, account list, or no-auth result.
      headers:
        Auth-Status:
          schema:
            type: string
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthSuccess"
              - $ref: "#/components/schemas/AuthError"
              - $ref: "#/components/schemas/AccountList"
        text/plain:
          schema:
            type: string
        application/x-www-form-urlencoded:
          schema:
            type: string
    AuthCBORSuccess:
      description: Authentication result, account list, or no-auth result.
      headers:
        Auth-Status:
          schema:
            type: string
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/cbor:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthSuccess"
              - $ref: "#/components/schemas/AuthError"
              - $ref: "#/components/schemas/AccountList"
        application/json:
          schema:
            $ref: "#/components/schemas/AccountList"
        text/plain:
          schema:
            type: string
        application/x-www-form-urlencoded:
          schema:
            type: string
    AsyncAccepted:
      description: Async job was queued.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncAcceptedResult"
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Request is authenticated but lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JSONValidationError:
      description: Invalid JSON or request validation failure.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/FieldErrorResponse"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Requested or submitted media type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SupportHistoryResultBasis:
      type: string
      description: >-
        Match state of an answer. matches_found wins over every condition; an answer without matches names the
        state of its primary source (logins for attempts, bruteforce_lifecycle for bans: missing table, no rows,
        failed read, expired or partially expired window), then truncated evidence, then an unresolved identity, then
        no_matches. Secondary sources only appear in history.conditions. Never read as "nothing happened".
      enum: [matches_found, no_matches, identity_unresolved, source_not_installed, source_without_rows, source_read_failed, window_expired, window_partially_expired, evidence_truncated]
      x-enum-varnames: [SupportHistoryBasisMatchesFound, SupportHistoryBasisNoMatches, SupportHistoryBasisIdentityUnresolved, SupportHistoryBasisSourceNotInstalled, SupportHistoryBasisSourceWithoutRows, SupportHistoryBasisSourceReadFailed, SupportHistoryBasisWindowExpired, SupportHistoryBasisWindowPartiallyExpired, SupportHistoryBasisEvidenceTruncated]
    SupportHistoryError:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, WINDOW_TOO_LARGE, INVALID_CURSOR, INVALID_ATTEMPT_ID, FORBIDDEN, QUERY_TOO_BROAD,
                HISTORY_BUSY, HISTORY_NOT_CONFIGURED, HISTORY_SOURCE_UNAVAILABLE, HISTORY_READER_UNSAFE, HISTORY_TIMEOUT,
                INTERNAL_ERROR]
            message: {type: string, description: Fixed English text per code; never parse it.}
    SupportHistorySubject:
      type: object
      additionalProperties: false
      description: Login is a claim as typed; account is a canonical account. At least one is required.
      properties:
        login: {type: string, maxLength: 256}
        account: {type: string, maxLength: 256}
    SupportHistoryPageRequest:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 50}
        cursor: {type: string, maxLength: 512, description: Opaque position bound to the same query; never authorizing.}
    SupportHistoryAuditReference:
      type: string
      pattern: "^[A-Za-z0-9._:/-]{1,64}$"
      description: Unverified ticket-like annotation recorded in the audit log only.
    SupportHistoryAttemptSearchRequest:
      type: object
      additionalProperties: false
      required: [schema_version, subject, filter]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        subject: {$ref: "#/components/schemas/SupportHistorySubject"}
        filter:
          type: object
          additionalProperties: false
          required: [from, until]
          properties:
            from: {type: string, format: date-time, description: Inclusive lower bound (event time).}
            until: {type: string, format: date-time, description: Exclusive upper bound; at most 31 days after from.}
            client_ip: {type: string, maxLength: 64}
            protocol: {type: string, maxLength: 64}
            oidc_client_id: {type: string, maxLength: 256}
            saml_entity_id: {type: string, maxLength: 1024}
        page: {$ref: "#/components/schemas/SupportHistoryPageRequest"}
        audit_reference: {$ref: "#/components/schemas/SupportHistoryAuditReference"}
        include_ban_context:
          type: boolean
          description: >-
            Adds ban_contexts and ban_history: every subject request of this page that brute-force protection rejected,
            linked server-side to the recorded ban instances effective at that time (also bans that began before the
            window). Absent or false keeps the answer unchanged. Independent of response_mode.
        response_mode:
          $ref: "#/components/schemas/SupportHistoryResponseMode"
          description: >-
            Presentation only. detailed (the default) returns full attempts; compact returns attempt_summaries and an
            empty attempts list. Neither mode changes rights: the projection always follows the token scopes.
    SupportHistoryAttemptDetailRequest:
      type: object
      additionalProperties: false
      required: [schema_version, attempt_id, around]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        attempt_id: {type: string, maxLength: 128, description: "fl1.<flow_ref> or rq1.<request id>"}
        around: {type: string, format: date-time}
        subject: {$ref: "#/components/schemas/SupportHistorySubject"}
        events_page:
          type: object
          additionalProperties: false
          description: >-
            One page of the attempt's events, default and at most 200. cursor is events_page.next_cursor of an earlier
            answer for the same attempt_id and around (also from a search answer).
          properties:
            cursor: {type: string, maxLength: 512}
            limit: {type: integer, minimum: 0, maximum: 200}
        audit_reference: {$ref: "#/components/schemas/SupportHistoryAuditReference"}
    SupportHistoryBanSearchRequest:
      type: object
      additionalProperties: false
      required: [schema_version, target, filter]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        target:
          type: object
          additionalProperties: false
          description: Exactly one of ip or network.
          properties:
            ip: {type: string, maxLength: 64}
            network: {type: string, maxLength: 64}
        filter:
          type: object
          additionalProperties: false
          required: [from, until]
          properties:
            from: {type: string, format: date-time}
            until: {type: string, format: date-time}
            ban_ref: {type: string, pattern: "^[0-9a-f]{32}$"}
        subject: {$ref: "#/components/schemas/SupportHistorySubject"}
        inner_page:
          type: object
          additionalProperties: false
          required: [list]
          description: >-
            One page of an inner list instead of the ban page. contributions and claimants need the ban_ref of one
            ban, and the answer lists only that ban; orphan_claimants names no ban. cursor is contributions.next_cursor,
            hits.claimants_next_cursor, or orphan_hits.claimants_next_cursor of an earlier answer to the same target and
            window. Default and maximum limit: 500 contributions, 50 claimants. Never combined with page.cursor.
          properties:
            ban_ref: {type: string, pattern: "^[0-9a-f]{32}$"}
            list: {type: string, enum: [contributions, claimants, orphan_claimants]}
            cursor: {type: string, maxLength: 512}
            limit: {type: integer, minimum: 0, maximum: 500}
        page:
          type: object
          additionalProperties: false
          properties:
            limit: {type: integer, minimum: 1, maximum: 20}
            cursor: {type: string, maxLength: 512}
        audit_reference: {$ref: "#/components/schemas/SupportHistoryAuditReference"}
    SupportOperationsWindow:
      type: object
      additionalProperties: false
      required: [from, until]
      properties:
        from: {type: string, format: date-time, description: Inclusive lower bound.}
        until: {type: string, format: date-time, description: Exclusive upper bound; not in the future.}
    SupportOperationsScope:
      type: object
      additionalProperties: false
      required: [window, queried_at, instance]
      properties:
        window: {$ref: "#/components/schemas/SupportOperationsWindow"}
        queried_at: {type: string, format: date-time}
        deployment: {type: string}
        instance: {type: string}
    SupportOperationsDiagnosticsRequest:
      type: object
      additionalProperties: false
      required: [schema_version]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        window:
          $ref: "#/components/schemas/SupportOperationsWindow"
          description: Defaults to the last 15 minutes; at most 24 hours.
        components:
          type: array
          maxItems: 7
          uniqueItems: true
          description: Components to diagnose; all when absent.
          items: {type: string, enum: [ldap, auth_backend, backend_monitoring, redis, clickhouse_export, auth_event_delivery, policy]}
        sources:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Sources to ask; all configured sources when absent.
          items: {type: string, enum: [nauthilus_runtime, loki, prometheus]}
        audit_reference: {$ref: "#/components/schemas/SupportHistoryAuditReference"}
    SupportOperationsSourceReport:
      type: object
      additionalProperties: false
      required: [coverage, name, kind, status, truncated]
      properties:
        coverage:
          type: object
          additionalProperties: false
          required: [instances]
          properties:
            from: {type: string, format: date-time}
            until: {type: string, format: date-time}
            instances: {type: array, items: {type: string}}
            view: {type: string, enum: [local_instance, log_labels, metric_labels]}
        name: {type: string, enum: [nauthilus_runtime, loki, prometheus]}
        kind: {type: string, enum: [local_current, historical]}
        status: {type: string, enum: [ok, partial, unavailable, timeout, not_configured, not_requested]}
        code: {type: string, description: Stable reason code of a non-ok status.}
        truncated: {type: boolean}
    SupportOperationsFinding:
      type: object
      additionalProperties: false
      required: [id, component, source, status, scope, observed, freshness, symptoms]
      properties:
        id: {type: string}
        component: {type: string, enum: [ldap, auth_backend, backend_monitoring, redis, clickhouse_export, auth_event_delivery, policy]}
        source: {type: string, enum: [nauthilus_runtime, loki, prometheus]}
        status: {type: string, enum: [failing, degraded, observed, not_observed, ok, unknown]}
        scope:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, enum: [instance, deployment]}
            instance: {type: string}
        labels: {type: object, additionalProperties: {type: string}, description: Observed infrastructure labels; untrusted data.}
        observed:
          type: object
          additionalProperties: false
          properties:
            at: {type: string, format: date-time}
            from: {type: string, format: date-time}
            until: {type: string, format: date-time}
        freshness:
          type: object
          additionalProperties: false
          required: [observed_at, basis, age_seconds]
          properties:
            observed_at: {type: string, format: date-time}
            counting_since: {type: string, format: date-time}
            basis: {type: string, enum: [current_state, process_lifetime_counter, log_window, metric_window]}
            age_seconds: {type: integer, minimum: 0}
        symptoms:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, count]
            properties:
              code: {type: string}
              count: {type: integer, minimum: 0}
    SupportOperationsHypothesis:
      type: object
      additionalProperties: false
      required: [code, confidence, basis, finding_ids, caveats]
      properties:
        code: {type: string}
        confidence: {type: string, enum: [low, medium]}
        basis: {type: string}
        finding_ids: {type: array, items: {type: string}}
        caveats: {type: array, items: {type: string}}
    SupportOperationsDiagnosticsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, scope, sources, findings, hypotheses, notes]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        scope: {$ref: "#/components/schemas/SupportOperationsScope"}
        sources: {type: array, items: {$ref: "#/components/schemas/SupportOperationsSourceReport"}}
        findings: {type: array, items: {$ref: "#/components/schemas/SupportOperationsFinding"}}
        hypotheses: {type: array, items: {$ref: "#/components/schemas/SupportOperationsHypothesis"}}
        notes: {type: array, items: {type: string}}
    SupportOperationsLogLevels:
      type: array
      maxItems: 5
      uniqueItems: true
      description: Log levels to read; error and warn when absent.
      items: {type: string, enum: [error, warn, notice, info, debug]}
    SupportOperationsLogGroupPage:
      type: object
      additionalProperties: false
      description: >-
        Message groups per page, default 50, at most 200. A cursor carries the window of the first page; a follow-up
        request may omit window or must repeat it.
      properties:
        cursor: {type: string, maxLength: 512, description: next_cursor of the previous answer of the same query.}
        limit: {type: integer, minimum: 0, maximum: 200}
    SupportOperationsLogEventPage:
      type: object
      additionalProperties: false
      description: >-
        Events per page, default 100, at most 500. A cursor carries the window of the first page; a follow-up request
        may omit window or must repeat it.
      properties:
        cursor: {type: string, maxLength: 512, description: next_cursor of the previous answer of the same query.}
        limit: {type: integer, minimum: 0, maximum: 500}
    SupportOperationsLogOverviewRequest:
      type: object
      additionalProperties: false
      required: [schema_version]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        window:
          $ref: "#/components/schemas/SupportOperationsWindow"
          description: Defaults to the last 15 minutes; at most 24 hours. The log source may clip it to its configured maximum.
        levels: {$ref: "#/components/schemas/SupportOperationsLogLevels"}
        page: {$ref: "#/components/schemas/SupportOperationsLogGroupPage"}
        audit_reference: {$ref: "#/components/schemas/SupportHistoryAuditReference"}
    SupportOperationsLogMessageGroup:
      type: object
      additionalProperties: false
      required: [id, level, message, message_exact, status, count, counts, instances]
      properties:
        id: {type: string, description: Position in the whole answer (L1 is the most frequent group).}
        level: {type: string, enum: [error, warn, notice, info, debug]}
        message: {type: string, description: The exact logged message; untrusted data.}
        secrets_redacted: {type: boolean, description: Authentication secrets inside the message were replaced.}
        message_exact:
          type: boolean
          description: >-
            message is the stored text unchanged and works as the message filter of operational_log_events; false when
            a secret was replaced or a format character made visible. Then filter the events by instance and the
            group's buckets instead.
        status: {type: string, enum: [observed], description: "A counted message is an observation, never an incident."}
        component: {type: string, enum: [ldap, auth_backend, backend_monitoring, redis, clickhouse_export, auth_event_delivery, policy]}
        symptom: {type: string, description: Diagnostics symptom code of a profiled message.}
        count: {type: integer, minimum: 0}
        counts: {type: array, items: {type: integer, minimum: 0}, description: One count per entry of buckets.}
        first_bucket_from: {type: string, format: date-time}
        last_bucket_until: {type: string, format: date-time}
        instances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [instance, count]
            properties:
              instance: {type: string}
              count: {type: integer, minimum: 0}
    SupportOperationsLogOverviewResponse:
      type: object
      additionalProperties: false
      required: [schema_version, scope, source, buckets, bucket_seconds, messages, page, notes]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        scope: {$ref: "#/components/schemas/SupportOperationsScope"}
        source: {$ref: "#/components/schemas/SupportOperationsSourceReport"}
        buckets: {type: array, items: {$ref: "#/components/schemas/SupportOperationsWindow"}}
        bucket_seconds: {type: integer, minimum: 0}
        messages: {type: array, items: {$ref: "#/components/schemas/SupportOperationsLogMessageGroup"}}
        page:
          type: object
          additionalProperties: false
          required: [limit, offset, total, next_cursor]
          description: The page of the message groups; total counts every group of the answer.
          properties:
            limit: {type: integer, minimum: 1}
            offset: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
            next_cursor: {type: [string, "null"]}
        notes: {type: array, items: {type: string}}
    SupportOperationsLogEventsRequest:
      type: object
      additionalProperties: false
      required: [schema_version]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        window:
          $ref: "#/components/schemas/SupportOperationsWindow"
          description: Defaults to the last 15 minutes; at most 24 hours. The log source may clip it to its configured maximum.
        levels: {$ref: "#/components/schemas/SupportOperationsLogLevels"}
        instance: {type: string, maxLength: 256, description: Only lines of this instance label value.}
        message: {type: string, minLength: 1, maxLength: 4096, description: "Only lines with exactly this message, as an overview group names it."}
        page: {$ref: "#/components/schemas/SupportOperationsLogEventPage"}
        audit_reference: {$ref: "#/components/schemas/SupportHistoryAuditReference"}
    SupportOperationsLogEvent:
      type: object
      additionalProperties: false
      required: [at, instance, level, message, format, labels, fields, line]
      properties:
        at: {type: string, format: date-time, description: Timestamp of the stored line with nanosecond precision.}
        instance: {type: string}
        level: {type: string}
        message: {type: string}
        format: {type: string, enum: [json, logfmt, raw]}
        labels: {type: object, additionalProperties: {type: string}, description: Stream labels of the line; untrusted data.}
        fields:
          type: object
          additionalProperties: true
          description: >-
            Every field of the log line complete; a name the line repeats holds the list of all its values in line
            order (named in repeated_fields). A raw line has no fields. Untrusted data.
        line: {type: string, description: The complete stored line with authentication secrets replaced.}
        repeated_fields: {type: array, items: {type: string}, description: "Fields whose name the line repeated, as dotted paths."}
        redacted_fields: {type: array, items: {type: string}, description: "Secret fields replaced by <redacted>, as dotted paths."}
        secrets_redacted: {type: boolean, description: Authentication secrets inside a text value were replaced.}
    SupportOperationsLogEventsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, scope, source, filter, events, gaps, page, notes]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        scope: {$ref: "#/components/schemas/SupportOperationsScope"}
        source: {$ref: "#/components/schemas/SupportOperationsSourceReport"}
        filter:
          type: object
          additionalProperties: false
          required: [levels]
          properties:
            levels: {type: array, items: {type: string}}
            instance: {type: string}
            message: {type: string}
        events: {type: array, items: {$ref: "#/components/schemas/SupportOperationsLogEvent"}}
        gaps:
          type: array
          description: >-
            Stored lines the source bounds could not return inside this page's span, with their time, stream labels,
            and reason (STREAM_RUN_EXCEEDS_READ, LINES_EXCEED_SOURCE_BYTE_BOUND, STREAMS_EXCEED_LISTING_BOUND,
            STREAMS_UNLISTED); paging continues after them.
          items:
            type: object
            additionalProperties: false
            required: [at, labels, reason]
            properties:
              at: {type: string, format: date-time}
              labels: {type: object, additionalProperties: {type: string}}
              reason: {type: string, enum: [STREAM_RUN_EXCEEDS_READ, LINES_EXCEED_SOURCE_BYTE_BOUND, STREAMS_EXCEED_LISTING_BOUND,
                STREAMS_UNLISTED]}
        page:
          type: object
          additionalProperties: false
          required: [limit, limit_applied, next_cursor]
          description: limit_applied is below limit when the source byte bound forced a smaller page; no line is lost.
          properties:
            limit: {type: integer, minimum: 1}
            limit_applied: {type: integer, minimum: 0}
            next_cursor: {type: [string, "null"]}
        notes: {type: array, items: {type: string}}
    SupportResponseSegmentRequest:
      type: object
      additionalProperties: false
      required: [schema_version, cursor]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        cursor: {type: string, maxLength: 512, description: segment.next_cursor of the previous segment.}
    SupportResponseSegmentResponse:
      type: object
      additionalProperties: false
      required: [schema_version, segment, data]
      description: One part of a complete answer that exceeded the transport bound.
      properties:
        schema_version: {type: string, pattern: "^1$"}
        data: {type: string, description: The next part of the JSON text of the complete answer.}
        segment:
          type: object
          additionalProperties: false
          required: [operation, offset, total_bytes, next_cursor]
          properties:
            operation: {type: string, description: The operation that produced the answer.}
            offset: {type: integer, minimum: 0, description: Byte offset of data in the complete answer.}
            total_bytes: {type: integer, minimum: 1}
            next_cursor: {type: [string, "null"], description: Cursor of the next segment; null on the last one.}
    SupportOperationsError:
      type: object
      additionalProperties: false
      required: [schema_version, error]
      properties:
        schema_version: {type: string, pattern: "^1$"}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_CURSOR, WINDOW_TOO_LARGE, FORBIDDEN, OPERATIONS_BUSY, OPERATIONS_NOT_CONFIGURED,
                INTERNAL_ERROR, SEGMENT_UNKNOWN, RESPONSE_TOO_LARGE]
            message: {type: string, description: Fixed English text per code; never parse it.}
    SupportHistoryCoverage:
      type: object
      additionalProperties: false
      required: [contract_rows_since, oidc_completion_events_since, sources, conditions, known_limits, availability,
        deployment, delivery_completeness, late_events_possible]
      properties:
        contract_rows_since: {type: [string, "null"], format: date-time}
        oidc_completion_events_since:
          type: [string, "null"]
          format: date-time
          description: >-
            First recorded OIDC completion event (oidc.code_issuance or oidc.code_redemption) of the deployment
            within the event retention. Flows that started before it, or every flow when it is null, predate
            completion recording and keep FLOW_COMPLETION_NEVER_RECORDED. Null also means the probe failed; then
            conditions contain COMPLETION_CUTOVER_UNKNOWN.
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source, state, window_coverage, retention_days]
            properties:
              source: {type: string, enum: [logins, auth_events, bruteforce_lifecycle, bruteforce_attempts, bruteforce_attempt_summary]}
              state: {type: string, enum: [read, read_failed, not_installed, no_rows_for_deployment, not_queried]}
              window_coverage: {type: string, enum: [within_retention, partially_expired, expired]}
              retention_days: {type: integer}
        conditions: {type: array, items: {type: string}}
        known_limits: {type: array, items: {type: string}}
        availability: {type: string, enum: [available, partial]}
        deployment: {type: string}
        delivery_completeness: {type: string, const: not_guaranteed}
        late_events_possible: {type: boolean}
    SupportHistorySubjectResolution:
      type: object
      additionalProperties: false
      required: [supplied_login, supplied_account, accounts, current_mapping]
      properties:
        supplied_login: {type: [string, "null"]}
        supplied_account: {type: [string, "null"]}
        accounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [account, provenance]
            properties:
              account: {type: string}
              provenance: {type: string, enum: [supplied_account, current_account_mapping, recorded_at_event]}
        current_mapping: {type: string, enum: [resolved, unmapped, unavailable, not_attempted]}
    SupportHistoryFinding:
      type: object
      additionalProperties: false
      required: [event_id, uncertainty, code, category, certainty]
      properties:
        event_id: {type: [string, "null"]}
        uncertainty: {type: array, items: {type: string}}
        code: {type: string}
        category: {type: string, enum: [success, credential, second_factor, pre_credential, policy, technical, flow_state, client_request, unknown]}
        certainty: {type: string, enum: [observed, uncertain]}
    SupportHistoryDecision:
      type: object
      additionalProperties: false
      required: [brute_force_bucket, brute_force_tolerated, answered_status_code, answered_status_message,
        decision_sources, operation, outcome, outcome_stage, outcome_marker, response_marker, policy_rule,
        tempfail_reason, tempfail_checkpoint, policy_status, fsm_state]
      properties:
        brute_force_bucket: {type: [string, "null"]}
        brute_force_tolerated: {type: [boolean, "null"]}
        answered_status_code:
          type: [integer, "null"]
          description: >-
            Stored host status code selected for the sealed terminal decision (logins.http_status: the configured
            OK/Fail/InternalError code; 200 for nginx-style answers, also for rejections). It is not the committed
            transport status (context.transport_status) and never a result: read outcome. Null when no terminal
            decision was sealed.
        answered_status_message:
          type: [string, "null"]
          description: >-
            Stored status text the host answered the authentication caller with (logins.status_msg). IdP browser
            pages render their own localized text, so this is not necessarily what a user saw. Null when no terminal
            decision was sealed.
        decision_sources: {type: array, items: {type: string}}
        operation: {type: string}
        outcome: {type: string}
        outcome_stage: {type: string}
        outcome_marker: {type: string}
        response_marker: {type: string}
        policy_rule: {type: string}
        tempfail_reason: {type: string}
        tempfail_checkpoint: {type: string}
        policy_status: {type: string}
        fsm_state: {type: string}
    SupportHistoryFactor:
      type: object
      additionalProperties: false
      required: [result, reason, flow_effect, fail_latched]
      properties:
        result: {type: string}
        reason: {type: string}
        flow_effect: {type: string}
        fail_latched: {type: boolean}
    SupportHistoryReputationAssessment:
      type: object
      additionalProperties: false
      required: [risk_score, trust_score, confidence, samples, source_diversity, age_seconds, fact, role, kind, state,
        profile, band, override]
      properties:
        risk_score: {type: [number, "null"]}
        trust_score: {type: [number, "null"]}
        confidence: {type: [number, "null"]}
        samples: {type: [number, "null"]}
        source_diversity: {type: [integer, "null"]}
        age_seconds: {type: [integer, "null"]}
        fact: {type: string}
        role: {type: string}
        kind: {type: string}
        state: {type: string}
        profile: {type: string}
        band: {type: string}
        override: {type: string}
    SupportHistoryReputation:
      type: object
      additionalProperties: false
      required: [assessments, state, truncated]
      properties:
        assessments: {type: array, items: {$ref: "#/components/schemas/SupportHistoryReputationAssessment"}}
        state: {type: string, enum: [recorded, none_recorded, legacy_not_projected]}
        truncated: {type: boolean}
    SupportHistoryEventIdentity:
      type: object
      additionalProperties: false
      required: [supplied_login, canonical_account, account_found_at_capture, matched_by, subject_match]
      properties:
        supplied_login: {type: [string, "null"]}
        canonical_account: {type: [string, "null"]}
        account_found_at_capture: {type: [boolean, "null"]}
        matched_by: {type: [string, "null"]}
        subject_match: {type: boolean}
    SupportHistoryEventContext:
      type: object
      additionalProperties: false
      required: [client_ip, protocol, service, oidc_client_id, saml_entity_id, grant_type, transport, transport_status]
      properties:
        client_ip: {type: [string, "null"]}
        protocol: {type: [string, "null"]}
        service: {type: [string, "null"]}
        oidc_client_id: {type: [string, "null"]}
        saml_entity_id: {type: [string, "null"]}
        grant_type: {type: [string, "null"]}
        transport: {type: [string, "null"]}
        transport_status: {type: [integer, "null"]}
    SupportHistoryEvent:
      type: object
      additionalProperties: false
      required: [occurred_at, event_id, factor_role, method, decision, factor, reputation, identity, context, source,
        request_id, instance, stage, result, code, category, sequence, record_version]
      properties:
        occurred_at: {type: string, format: date-time}
        event_id: {type: [string, "null"]}
        factor_role: {type: [string, "null"]}
        method: {type: [string, "null"]}
        decision:
          oneOf:
            - $ref: "#/components/schemas/SupportHistoryDecision"
            - type: "null"
        factor:
          oneOf:
            - $ref: "#/components/schemas/SupportHistoryFactor"
            - type: "null"
        reputation:
          oneOf:
            - $ref: "#/components/schemas/SupportHistoryReputation"
            - type: "null"
        identity: {$ref: "#/components/schemas/SupportHistoryEventIdentity"}
        context: {$ref: "#/components/schemas/SupportHistoryEventContext"}
        source: {type: string, enum: [logins, auth_events]}
        request_id: {type: string}
        instance: {type: string}
        stage: {type: string, enum: [primary_authentication, second_factor, pre_credential, legacy, authorization, token_exchange, unclassified]}
        result: {type: string}
        code: {type: string}
        category: {type: string}
        sequence: {type: integer}
        record_version: {type: integer}
    SupportHistoryAttempt:
      type: object
      additionalProperties: false
      required: [started_at, last_observed_at, completion, findings, events, recording, steps, attempt_id, kind,
        projection, outcome, outcome_basis, progress, final_outcome_observed]
      properties:
        events_page:
          type: object
          additionalProperties: false
          required: [next_cursor, detail, limit]
          description: >-
            Present when more recorded events follow or the detail request selected an events page. Pass detail and
            next_cursor to authentication_attempt_detail (events_page.cursor) for the next events; recording.events_truncated
            is true exactly when next_cursor is set.
          properties:
            next_cursor: {type: [string, "null"]}
            limit: {type: integer, minimum: 1}
            detail:
              type: object
              additionalProperties: false
              required: [attempt_id, around]
              properties:
                attempt_id: {type: string}
                around: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        last_observed_at: {type: string, format: date-time}
        completion:
          oneOf:
            - $ref: "#/components/schemas/SupportHistoryCompletion"
            - type: "null"
        findings: {type: array, items: {$ref: "#/components/schemas/SupportHistoryFinding"}}
        events: {type: array, items: {$ref: "#/components/schemas/SupportHistoryEvent"}}
        recording:
          type: object
          additionalProperties: false
          required: [known_gaps, replayed_rows_merged, legacy_rows, events_truncated]
          properties:
            known_gaps: {type: array, items: {type: string}}
            replayed_rows_merged: {type: integer}
            legacy_rows: {type: integer}
            events_truncated: {type: boolean, description: The attempt hit the per-attempt event limit of the store read.}
        steps:
          type: object
          additionalProperties: false
          required: [primary, second_factor, code_issuance, code_redemption]
          properties:
            primary:
              type: string
              enum: [recorded, not_recorded, session_reused]
              description: session_reused marks an OIDC flow that /authorize started for an already authenticated session; no primary step happened in it.
            second_factor: {type: string, enum: [recorded, not_recorded, not_applicable], x-enum-varnames: [SupportHistorySecondFactorStepRecorded, SupportHistorySecondFactorStepNotRecorded, SupportHistorySecondFactorStepNotApplicable]}
            code_issuance: {type: string, enum: [recorded, not_recorded, not_applicable], x-enum-varnames: [SupportHistoryCodeIssuanceStepRecorded, SupportHistoryCodeIssuanceStepNotRecorded, SupportHistoryCodeIssuanceStepNotApplicable]}
            code_redemption: {type: string, enum: [recorded, not_recorded, not_applicable], x-enum-varnames: [SupportHistoryCodeRedemptionStepRecorded, SupportHistoryCodeRedemptionStepNotRecorded, SupportHistoryCodeRedemptionStepNotApplicable]}
        attempt_id: {type: string}
        kind: {type: string, enum: [flow, request]}
        projection: {type: string, enum: [detail], description: Always detail; every reader receives the complete data.}
        outcome: {type: string, enum: [succeeded, rejected, technical_error, not_observed, unknown]}
        outcome_basis:
          type: string
          enum: [request_terminal_answer, primary_failure_latched, primary_failure_kept, none, legacy,
            oidc_tokens_issued, oidc_code_redemption_rejected, oidc_code_redemption_failed]
          description: >-
            The recorded evidence of the outcome. outcome never names a cause: oidc_code_redemption_rejected after a
            successful login is a rejected token request of the client, not a credential failure. Show outcome_basis
            and the findings together with outcome.
        progress:
          type: string
          enum: [none, technical_error, pre_credential_rejected, primary_rejected, primary_succeeded,
            second_factor_completed, primary_failure_latched, authorization_code_issued, tokens_issued]
        final_outcome_observed: {type: boolean}
    SupportHistoryCompletion:
      type: object
      additionalProperties: false
      description: >-
        Recorded OIDC authorization-code completion of one flow. Nauthilus's part ends with the token response for
        the flow's code (state tokens_issued); a relying-party session after it is never observed. Only
        authorization-code flows carry this block; SAML, device-code, flows without grant evidence, and latched flows
        (decided by the latch) have none.
      required: [code_issued_at, code_redeemable_until, redemption_observed_at, scope, state, authentication]
      properties:
        code_issued_at: {type: [string, "null"], format: date-time}
        code_redeemable_until:
          type: [string, "null"]
          format: date-time
          description: Latest instant the issued code could be redeemed (event contract version lifetime); null without issuance or for an unknown version.
        redemption_observed_at: {type: [string, "null"], format: date-time}
        scope: {type: string, const: oidc_authorization_code}
        state:
          type: string
          enum: [tokens_issued, redemption_rejected, redemption_failed, redemption_pending,
            code_expired_redemption_not_observed, code_issuance_not_observed, not_recorded, unknown]
          description: >-
            tokens_issued, redemption_rejected, and redemption_failed are observed and final. redemption_pending: the
            code may still be redeemed or its redemption still be exported. code_expired_redemption_not_observed: the
            code can no longer be redeemed and no redemption was observed; an event may have been dropped, so it
            never proves an abort. code_issuance_not_observed: recording was active, but neither issuance nor
            redemption was observed. not_recorded: the flow predates completion recording. unknown: evidence was
            unreadable, truncated, conflicting, or unclassified.
        authentication:
          type: string
          enum: [authenticated_in_flow, existing_session, not_recorded, unknown]
          description: How the flow got its authenticated identity, as recorded with the code issuance; unknown without an observed issuance.
    SupportHistoryAttemptSearchResponse:
      type: object
      additionalProperties: false
      required: [queried_at, history, subject_resolution, attempts, page, schema_version, result_basis]
      properties:
        queried_at: {type: string, format: date-time}
        history: {$ref: "#/components/schemas/SupportHistoryCoverage"}
        subject_resolution: {$ref: "#/components/schemas/SupportHistorySubjectResolution"}
        attempts: {type: array, items: {$ref: "#/components/schemas/SupportHistoryAttempt"}}
        page:
          type: object
          additionalProperties: false
          required: [scanned_until, next_cursor, limit]
          properties:
            scanned_until: {type: string, format: date-time, description: "The search covered (scanned_until, until) completely; attempts anchored exactly at scanned_until can follow on the next page."}
            next_cursor: {type: [string, "null"]}
            limit: {type: integer}
        schema_version: {type: string, pattern: "^1$"}
        result_basis: {$ref: "#/components/schemas/SupportHistoryResultBasis"}
        response_mode:
          $ref: "#/components/schemas/SupportHistoryResponseMode"
          description: Present only when the request named response_mode; compact answers carry an empty attempts list.
        attempt_summaries:
          type: array
          description: Present only in compact mode; one summary per found attempt, in the order of attempts.
          items: {$ref: "#/components/schemas/SupportHistoryAttemptSummary"}
        ban_contexts:
          type: array
          description: Present only with include_ban_context; one entry per brute-force rejected subject request of the page.
          items: {$ref: "#/components/schemas/SupportHistoryBanContext"}
        ban_history:
          $ref: "#/components/schemas/SupportHistoryCoverage"
          description: Present only with include_ban_context when brute-force evidence is configured; coverage of the brute-force sources.
    SupportHistoryAttemptDetailResponse:
      type: object
      additionalProperties: false
      required: [queried_at, attempt, subject_resolution, history, schema_version, result_basis]
      properties:
        queried_at: {type: string, format: date-time}
        attempt:
          oneOf:
            - $ref: "#/components/schemas/SupportHistoryAttempt"
            - type: "null"
        subject_resolution:
          oneOf:
            - $ref: "#/components/schemas/SupportHistorySubjectResolution"
            - type: "null"
        history: {$ref: "#/components/schemas/SupportHistoryCoverage"}
        schema_version: {type: string, pattern: "^1$"}
        result_basis: {$ref: "#/components/schemas/SupportHistoryResultBasis"}
    SupportHistoryActivation:
      type: object
      additionalProperties: false
      required: [at, bucket_id, window_index, window_current, window_previous, total, effective_limit, planned_end, kind,
        rule, stored_rule, rule_fingerprint, instance, activating_request, period_seconds, ban_time_seconds,
        failed_requests]
      properties:
        at: {type: string, format: date-time}
        bucket_id: {type: [string, "null"]}
        window_index: {type: [integer, "null"]}
        window_current: {type: [integer, "null"]}
        window_previous: {type: [integer, "null"]}
        total: {type: [number, "null"]}
        effective_limit: {type: [number, "null"]}
        planned_end: {type: [string, "null"], format: date-time}
        kind: {type: string, enum: [ban_activated, ban_activation_unconfirmed]}
        rule: {type: string}
        stored_rule: {type: string}
        rule_fingerprint: {type: string}
        instance: {type: string}
        activating_request: {type: string, const: NOT_A_CULPRIT}
        period_seconds: {type: integer}
        ban_time_seconds: {type: integer}
        failed_requests: {type: integer}
    SupportHistoryWindowStatus:
      type: object
      additionalProperties: false
      required: [expected, present, window, status, evidence, window_index, counts_are_upper_bounds,
        summary_check_unreliable]
      properties:
        expected: {type: [integer, "null"]}
        present: {type: [integer, "null"]}
        window: {type: string, enum: [activation_window, previous_window]}
        status: {type: string, enum: [complete, loss_detected, aggregate_only, expired, not_applicable], x-enum-varnames: [SupportHistoryContributionStatusComplete, SupportHistoryContributionStatusLossDetected, SupportHistoryContributionStatusAggregateOnly, SupportHistoryContributionStatusExpired, SupportHistoryContributionStatusNotApplicable]}
        evidence: {type: string, enum: [raw, summary, not_read, not_assessed]}
        window_index: {type: integer}
        counts_are_upper_bounds: {type: boolean}
        summary_check_unreliable: {type: boolean}
    SupportHistoryContribution:
      type: object
      additionalProperties: false
      required: [at, window_index, window_current, crossed, account_known, claimed_username, account, client_ip,
        subject_match, event_id, request_id, count_source, protocol]
