name: Reputation journal integration

on:
  push:
    branches: [features, main]
  pull_request:
    branches: [features, main]

permissions:
  contents: read

jobs:
  kafka-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.27.1
      - name: Install private Redis test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Test dedicated consumer and operational route boundary
        run: GOEXPERIMENT=runtimesecret go test -mod=vendor -tags=reputation_worker ./contrib/plugins/reputation -count=1
      - name: Run Kafka and Redis recovery tests
        run: GOEXPERIMENT=runtimesecret make reputation-kafka-check
