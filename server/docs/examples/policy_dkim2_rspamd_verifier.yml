# Strict reference Policy: thresholds and .example identities are illustrative operator settings.
# Load the reputation, GeoIP and DKIM2 intelligence modules from go_plugin_dkim2_intelligence.yml.
# All hard denies precede operator rules and permits. Use the separate observation target fragment while calibrating.
# Replace only the credential placeholder; the caller sends the unchanged sealed verifier projection.
policy:
    api:
        clients:
            - allowed_environment_attributes:
                - rspamd.scan_action_before_policy
                - rspamd.metric_score
                - rspamd.reject_threshold
                - rspamd.greylist_threshold
                - rspamd.normalized_signals
                - rspamd.smtp_client_ip
                - rspamd.client_class
                - rspamd.mail_from_class
                - rspamd.recipient_classes
                - rspamd.smtp_authenticated
                - rspamd.recipient_count
                - rspamd.message_size
                - rspamd.message_fidelity
              allowed_input_attributes: []
              allowed_resource_attributes:
                - dkim2.projection_schema
                - dkim2.draft
                - dkim2.projection_binding_algorithm
                - dkim2.projection_binding
                - dkim2.verification_state
                - dkim2.verification_reason
                - dkim2.scope
                - dkim2.historical_content
                - dkim2.historical_signatures
                - dkim2.custody_structure
                - dkim2.target_sequence
                - dkim2.target_message_instance
                - dkim2.claimed_hop_count
                - dkim2.authentication_state
                - dkim2.authentication_reason
                - dkim2.replay_class
                - dkim2.local_policy_mode
                - dkim2.local_policy_verdict
                - dkim2.local_policy_reason
                - dkim2.do_not_modify_state
                - dkim2.do_not_explode_state
                - dkim2.dns_testing_effective
                - dkim2.disposition
                - dkim2.chain
                - dkim2.received_dsn_propagation
              allowed_schemas:
                - dkim2/accept-message-instance/v1
              allowed_subject_attributes: []
              authentication:
                basic:
                    password: ${POLICY_DKIM2_RSPAMD_PASSWORD}
                    username: rspamd-verifier
              authentication_kinds:
                - basic
              diagnostics: false
              max_concurrency: 16
              max_facts: 48
              max_request_bytes: 524288
              principal: rspamd-verifier
              requests_per_second: 50
              require_mtls: false
              targets:
                - actions:
                    - accept-message-instance
                  namespace: dkim2
        enabled: true
        grpc:
            enabled: true
            require_mtls: true
        http:
            enabled: true
        limits:
            evaluation_timeout: 2s
            max_advice: 0
            max_facts: 64
            max_list_items: 128
            max_obligations: 0
            max_parameter_bytes: 0
            max_request_bytes: 524288
            max_string_bytes: 4096
            max_value_bytes: 262144
            per_client_concurrency: 16
            per_client_requests_per_second: 50
            provider_timeout: 500ms
    namespaces:
        dkim2:
            domain_plans:
                verifier:
                    checkpoints:
                        final_decision:
                            providers:
                                - name: smtp_peer
                                  skip_if:
                                    - nonpass_verifier_state
                                  use: dkim2/plugin.geoip.smtp_peer
                                - name: reputation_assessment
                                  skip_if:
                                    - nonpass_verifier_state
                                  use: dkim2/plugin.reputation.assessment
                                - name: intelligence_assessment
                                  skip_if:
                                    - nonpass_verifier_state
                                  use: dkim2/plugin.dkim2_intelligence.assessment
                    scheduler_guards:
                        nonpass_verifier_state:
                            if:
                                attribute: resource.dkim2.verification_state
                                not_in:
                                    - PASS
                            on_missing_attribute: run
            policy_sets:
                verifier:
                    rules:
                        - checkpoint: final_decision
                          if:
                            attribute: resource.dkim2.verification_state
                            not_in:
                                - PASS
                          name: deny_nonpass_verifier_state
                          then:
                            decision: deny
                            reason: dkim2_deny_nonpass_verifier_state
                        - checkpoint: final_decision
                          if:
                            attribute: resource.dkim2.authentication_state
                            not_in:
                                - PASS
                          name: deny_nonpass_authentication
                          then:
                            decision: deny
                            reason: dkim2_deny_nonpass_authentication
                        - checkpoint: final_decision
                          if:
                            attribute: resource.dkim2.replay_class
                            not_in:
                                - first_seen
                                - exploded
                          name: deny_replay
                          then:
                            decision: deny
                            reason: dkim2_deny_replay
                        - checkpoint: final_decision
                          if:
                            attribute: resource.dkim2.custody_structure
                            eq: terminal_nd_requires_oob
                          name: deny_terminal_nd
                          then:
                            decision: deny
                            reason: dkim2_deny_terminal_nd
                        - checkpoint: final_decision
                          if:
                            attribute: resource.dkim2.local_policy_verdict
                            not_in:
                                - continue
                                - accept
                          name: deny_noncontinuable_local_verdict
                          then:
                            decision: deny
                            reason: dkim2_deny_noncontinuable_local_verdict
                        - checkpoint: final_decision
                          if:
                            attribute: resource.dkim2.disposition
                            not_in:
                                - continue
                                - accept
                          name: deny_noncontinuable_disposition
                          then:
                            decision: deny
                            reason: dkim2_deny_noncontinuable_disposition
                        - checkpoint: final_decision
                          if:
                            not:
                                attribute: plugin.dkim2_intelligence.assessment_complete
                                eq: true
                          name: deny_incomplete_assessment
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_incomplete_assessment
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.assessed_chain
                                quantifier: any
                                where:
                                    field: signature_state
                                    not_in:
                                        - pass
                          name: deny_signature_state
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_signature_state
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.assessed_chain
                                quantifier: any
                                where:
                                    contains_any:
                                        - authentication_not_pass
                                        - body_unavailable
                                        - do_not_explode_violated
                                        - do_not_modify_violated
                                        - history_not_matched
                                        - terminal_oob_required
                                        - upstream_nonpermittable
                                    field: violation_classes
                          name: deny_integrity_violation
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_integrity_violation
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.assessed_chain
                                quantifier: any
                                where:
                                    all:
                                        - field: signer_reputation_band
                                          in:
                                            - suspicious
                                            - blocked
                                        - contains: body.rewrite
                                          field: change_classes
                          name: deny_bad_reputation_body_change
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_bad_reputation_body_change
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.smtp_peer
                                quantifier: any
                                where:
                                    all:
                                        - eq: fresh
                                          field: ip_state
                                        - field: ip_band
                                          in:
                                            - suspicious
                                            - blocked
                                        - field: ip_confidence
                                          gte: 0.6
                          name: deny_bad_smtp_peer_ip_reputation
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_bad_smtp_peer_ip_reputation
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.smtp_peer
                                quantifier: any
                                where:
                                    all:
                                        - eq: fresh
                                          field: network_state
                                        - field: network_band
                                          in:
                                            - suspicious
                                            - blocked
                                        - field: network_confidence
                                          gte: 0.6
                          name: deny_bad_smtp_peer_network_reputation
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_bad_smtp_peer_network_reputation
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.smtp_peer
                                quantifier: any
                                where:
                                    all:
                                        - eq: fresh
                                          field: asn_state
                                        - field: asn_band
                                          in:
                                            - suspicious
                                            - blocked
                                        - field: asn_samples
                                          gte: 20.0
                                        - field: asn_confidence
                                          gte: 0.7
                          name: deny_bad_smtp_peer_asn_reputation
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_bad_smtp_peer_asn_reputation
                        - checkpoint: final_decision
                          if:
                            all:
                                - attribute: environment.rspamd.metric_score
                                  gte: 8.0
                                - records:
                                    attribute: plugin.dkim2_intelligence.smtp_peer
                                    quantifier: any
                                    where:
                                        any:
                                            - all:
                                                - eq: fresh
                                                  field: ip_state
                                                - field: ip_band
                                                  in:
                                                    - suspicious
                                                    - blocked
                                            - all:
                                                - eq: fresh
                                                  field: network_state
                                                - field: network_band
                                                  in:
                                                    - suspicious
                                                    - blocked
                                            - all:
                                                - eq: fresh
                                                  field: asn_state
                                                - field: asn_band
                                                  in:
                                                    - suspicious
                                                    - blocked
                          name: deny_rspamd_risk_on_known_bad_ingress
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_rspamd_risk_on_known_bad_ingress
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.assessed_chain
                                quantifier: any
                                where:
                                    all:
                                        - eq: relay.example
                                          field: signer_domain
                                        - contains: body.rewrite
                                          field: change_classes
                          name: deny_body_change_for_header_only_signer
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_body_change_for_header_only_signer
                        - checkpoint: final_decision
                          if:
                            any:
                                - records:
                                    attribute: plugin.dkim2_intelligence.assessed_chain
                                    quantifier: any
                                    where:
                                        field: signer_reputation_state
                                        not_in:
                                            - fresh
                                - records:
                                    attribute: plugin.dkim2_intelligence.smtp_peer
                                    quantifier: any
                                    where:
                                        field: ip_state
                                        not_in:
                                            - fresh
                                - records:
                                    attribute: plugin.dkim2_intelligence.smtp_peer
                                    quantifier: any
                                    where:
                                        field: network_state
                                        not_in:
                                            - fresh
                                - records:
                                    attribute: plugin.dkim2_intelligence.smtp_peer
                                    quantifier: any
                                    where:
                                        field: asn_state
                                        not_in:
                                            - fresh
                                - records:
                                    attribute: plugin.dkim2_intelligence.smtp_peer
                                    quantifier: any
                                    where:
                                        field: geoip_state
                                        not_in:
                                            - fresh
                          name: deny_unusable_reputation
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_unusable_reputation
                        - checkpoint: final_decision
                          if:
                            records:
                                attribute: plugin.dkim2_intelligence.assessed_chain
                                quantifier: any
                                where:
                                    all:
                                        - eq: true
                                          field: is_target
                                        - any:
                                            - field: identity_contract_state
                                              not_in:
                                                - matched
                                            - field: identity_contract_strength
                                              not_in:
                                                - cidr
                                                - asn
                          name: deny_target_identity
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: deny
                            reason: dkim2_deny_target_identity
                        - checkpoint: final_decision
                          if:
                            all:
                                - attribute: plugin.dkim2_intelligence.assessment_complete
                                  eq: true
                                - records:
                                    attribute: plugin.dkim2_intelligence.assessed_chain
                                    quantifier: all
                                    where:
                                        all:
                                            - eq: pass
                                              field: signature_state
                                            - eq: fresh
                                              field: signer_reputation_state
                                            - field: signer_reputation_band
                                              in:
                                                - trusted
                                                - positive
                                                - neutral
                                            - contains_none:
                                                - body.rewrite
                                              field: change_classes
                                - records:
                                    attribute: plugin.dkim2_intelligence.assessed_chain
                                    quantifier: any
                                    where:
                                        all:
                                            - eq: true
                                              field: is_target
                                            - field: signer_domain
                                              in:
                                                - google.example
                                                - yahoo.example
                                            - eq: matched
                                              field: identity_contract_state
                                            - field: identity_contract_strength
                                              in:
                                                - cidr
                                                - asn
                                            - contains_none:
                                                - body.rewrite
                                              field: change_classes
                                - records:
                                    attribute: plugin.dkim2_intelligence.smtp_peer
                                    quantifier: any
                                    where:
                                        all:
                                            - eq: fresh
                                              field: geoip_state
                                            - eq: fresh
                                              field: ip_state
                                            - field: ip_band
                                              in:
                                                - trusted
                                                - positive
                                                - neutral
                                            - eq: fresh
                                              field: network_state
                                            - field: network_band
                                              in:
                                                - trusted
                                                - positive
                                                - neutral
                                            - eq: fresh
                                              field: asn_state
                                            - field: asn_band
                                              in:
                                                - trusted
                                                - positive
                                                - neutral
                          name: permit_selected_provider_header_relay
                          require_providers:
                            - intelligence_assessment
                          then:
                            decision: permit
                            reason: dkim2_permit_selected_provider_header_relay
                    visibility: private
            providers:
                intelligence_assessment:
                    component: assessment
                    failure: indeterminate
                    kind: native
                    module: dkim2_intelligence
                    produced_facts:
                        - plugin.dkim2_intelligence.assessed_chain
                        - plugin.dkim2_intelligence.smtp_peer
                        - plugin.dkim2_intelligence.assessment_complete
                    requires:
                        - dkim2/plugin.reputation.assessment
                        - dkim2/plugin.geoip.smtp_peer
                    targets:
                        - action: accept-message-instance
                    timeout: 400ms
                reputation_assessment:
                    component: assessment
                    failure: indeterminate
                    kind: native
                    module: reputation
                    produced_facts:
                        - plugin.reputation.dkim2_subjects
                        - plugin.reputation.dkim2_subjects_fast
                        - plugin.reputation.dkim2_subjects_operational
                        - plugin.reputation.dkim2_subjects_baseline
                    requires:
                        - dkim2/plugin.geoip.smtp_peer
                    targets:
                        - action: accept-message-instance
                    timeout: 400ms
                smtp_peer:
                    component: smtp_peer
                    failure: indeterminate
                    kind: native
                    module: geoip
                    produced_facts:
                        - plugin.geoip.lookup_state
                        - plugin.geoip.ip
                        - plugin.geoip.network
                        - plugin.geoip.country_iso
                        - plugin.geoip.country_name
                        - plugin.geoip.city_name
                        - plugin.geoip.asn_org
                        - plugin.geoip.asn_prefix
                        - plugin.geoip.asn_registry
                        - plugin.geoip.asn_country_iso
                        - plugin.geoip.asn_allocated
                        - plugin.geoip.asn_status
                        - plugin.geoip.privacy_lookup_state
                        - plugin.geoip.privacy_primary_class
                        - plugin.geoip.data_age_seconds
                        - plugin.geoip.asn
                        - plugin.geoip.data_stale
                        - plugin.geoip.matched
                        - plugin.geoip.privacy_detected
                        - plugin.geoip.privacy_data_stale
                        - plugin.geoip.is_tor_exit_node
                        - plugin.geoip.is_known_vpn_exit
                        - plugin.geoip.is_community_vpn_exit
                        - plugin.geoip.is_public_proxy
                        - plugin.geoip.is_privacy_relay
                        - plugin.geoip.is_hosting_network
                        - plugin.geoip.is_shared_egress
                        - plugin.geoip.privacy_confidence
                        - plugin.geoip.privacy_data_age_seconds
                        - plugin.geoip.privacy_classes
                        - plugin.geoip.privacy_source_authorities
                    targets:
                        - action: accept-message-instance
                    timeout: 400ms
            schema_contributions:
                static:
                    accept-message-instance:
                        versions:
                            v1:
                                facts:
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.projection_schema
                                      category: resource
                                      max_length: 64
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.draft
                                      category: resource
                                      max_length: 64
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.projection_binding_algorithm
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.projection_binding
                                      category: resource
                                      max_bytes: 32
                                      required: true
                                      type: bytes
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.verification_state
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.verification_reason
                                      category: resource
                                      max_length: 64
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.scope
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.historical_content
                                      category: resource
                                      max_length: 24
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.historical_signatures
                                      category: resource
                                      max_length: 24
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.custody_structure
                                      category: resource
                                      max_length: 32
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.target_sequence
                                      category: resource
                                      required: true
                                      type: integer
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.target_message_instance
                                      category: resource
                                      required: true
                                      type: integer
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.claimed_hop_count
                                      category: resource
                                      required: true
                                      type: integer
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.authentication_state
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.authentication_reason
                                      category: resource
                                      max_length: 64
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.replay_class
                                      category: resource
                                      max_length: 24
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.local_policy_mode
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.local_policy_verdict
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.local_policy_reason
                                      category: resource
                                      max_length: 64
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.do_not_modify_state
                                      category: resource
                                      max_length: 32
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.do_not_explode_state
                                      category: resource
                                      max_length: 32
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.dns_testing_effective
                                      category: resource
                                      required: true
                                      type: boolean
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.disposition
                                      category: resource
                                      max_length: 16
                                      required: true
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.received_dsn_propagation
                                      category: resource
                                      max_length: 30
                                      required: false
                                      type: string
                                    - allowed_sources:
                                        - caller
                                      attribute: resource.dkim2.chain
                                      category: resource
                                      record_schema:
                                        fields:
                                            - expression_visible: true
                                              name: sequence
                                              required: true
                                              type: integer
                                            - expression_visible: true
                                              name: message_instance
                                              required: true
                                              type: integer
                                            - max_bytes: 32
                                              name: hop_binding
                                              provider_visibility:
                                                - dkim2/plugin.reputation.assessment
                                                - dkim2/plugin.dkim2_intelligence.assessment
                                              required: true
                                              type: bytes
                                            - expression_visible: true
                                              max_length: 253
                                              name: signer_domain
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              max_items: 4
                                              max_length: 32
                                              name: signature_algorithms
                                              required: true
                                              type: strings
                                            - expression_visible: true
                                              max_length: 16
                                              name: signature_state
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              max_length: 32
                                              name: custody_transition
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              name: do_not_modify
                                              required: true
                                              type: boolean
                                            - expression_visible: true
                                              name: do_not_explode
                                              required: true
                                              type: boolean
                                            - expression_visible: true
                                              name: feedback
                                              required: true
                                              type: boolean
                                            - expression_visible: true
                                              name: feed_here
                                              required: true
                                              type: boolean
                                            - expression_visible: true
                                              name: exploded
                                              required: true
                                              type: boolean
                                            - expression_visible: true
                                              max_length: 16
                                              name: recipe_mode
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              name: recipe_has_header_changes
                                              required: true
                                              type: boolean
                                            - expression_visible: true
                                              max_length: 16
                                              name: recipe_body_mode
                                              required: true
                                              type: string
                                            - max_bytes: 32
                                              name: recipe_digest
                                              provider_visibility:
                                                - dkim2/plugin.dkim2_intelligence.assessment
                                              required: true
                                              type: bytes
                                            - expression_visible: true
                                              max_items: 2
                                              max_length: 64
                                              name: change_classes
                                              required: true
                                              type: strings
                                            - max_items: 128
                                              max_length: 64
                                              name: affected_headers
                                              required: true
                                              type: strings
                                            - expression_visible: true
                                              max_length: 16
                                              name: history_header_state
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              max_length: 16
                                              name: history_body_state
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              max_length: 16
                                              name: body_availability
                                              required: true
                                              type: string
                                            - expression_visible: true
                                              name: change_count
                                              required: true
                                              type: integer
                                            - expression_visible: true
                                              name: affected_header_count
                                              required: true
                                              type: integer
                                        id: verifier_chain
                                        max_aggregate_bytes: 196608
                                        max_fields: 23
                                        max_records: 128
                                        min_records: 1
