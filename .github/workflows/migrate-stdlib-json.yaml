name: One-shot encoding/json migration

on:
  push:
    branches:
      - feature/stdlib-encoding-json

permissions:
  contents: write

env:
  GOEXPERIMENT: runtimesecret

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feature/stdlib-encoding-json
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.27.1
          check-latest: true

      - name: Replace jsoniter with encoding/json
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          candidates = [p for p in root.rglob('*.go') if 'vendor' not in p.parts]
          backup = Path('client/main_old.go.bak')
          if backup.exists():
              candidates.append(backup)

          changed_go = []
          changed_other = []
          for path in candidates:
              text = path.read_text()
              original = text

              text = text.replace('fastJSON.', 'json.')
              text = text.replace('jsonIter.', 'json.')

              text = text.replace('f.jsonAPI.Marshal', 'json.Marshal')
              text = text.replace('f.jsonAPI.Unmarshal', 'json.Unmarshal')
              text = re.sub(r'(?m)^\s*jsonAPI\s+jsoniter\.API\s*\n', '', text)
              text = re.sub(r'(?m)^\s*jsonAPI:\s*jsoniter\.ConfigCompatibleWithStandardLibrary,?\s*\n', '', text)

              text = text.replace('jsoniter.ConfigFastest.Marshal', 'json.Marshal')
              text = text.replace('jsoniter.ConfigFastest.Unmarshal', 'json.Unmarshal')
              text = text.replace('jsoniter.ConfigCompatibleWithStandardLibrary.Marshal', 'json.Marshal')
              text = text.replace('jsoniter.ConfigCompatibleWithStandardLibrary.Unmarshal', 'json.Unmarshal')
              text = text.replace('jsoniter.Marshal', 'json.Marshal')
              text = text.replace('jsoniter.Unmarshal', 'json.Unmarshal')

              text = re.sub(
                  r'(?m)^var\s+(?:json|fastJSON|jsonIter)\s*=\s*jsoniter\.(?:ConfigFastest|ConfigCompatibleWithStandardLibrary)\s*\n',
                  '',
                  text,
              )
              text = text.replace('// jsonIter is a package-level variable for jsoniter with standard configuration\n', '')

              import_pattern = r'(?m)^\s*jsoniter\s+"github\.com/json-iterator/go"\s*\n'
              if re.search(import_pattern, text):
                  if '"encoding/json"' in text:
                      text = re.sub(import_pattern, '', text)
                  else:
                      text = re.sub(import_pattern, '\t"encoding/json"\n', text)

              if text != original:
                  path.write_text(text)
                  if path.suffix == '.go':
                      changed_go.append(str(path))
                  else:
                      changed_other.append(str(path))

          if not changed_go:
              raise SystemExit('No Go files were migrated')

          Path('/tmp/json-migrated-go-files').write_text('\n'.join(changed_go) + '\n')
          print(f'Migrated {len(changed_go)} Go files')
          if changed_other:
              print('Also migrated: ' + ', '.join(changed_other))

          remaining = []
          for path in [p for p in root.rglob('*.go') if 'vendor' not in p.parts]:
              text = path.read_text()
              if any(marker in text for marker in (
                  'github.com/json-iterator/go', 'jsoniter.', 'jsonIter.', 'fastJSON.', 'jsonAPI'
              )):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('Unmigrated jsoniter references: ' + ', '.join(remaining))
          PY

          xargs -r gofmt -w < /tmp/json-migrated-go-files

      - name: Refresh module and vendor state
        run: |
          set -euo pipefail
          go mod tidy
          go mod vendor

      - name: Verify dependency removal
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.go' --exclude-dir=vendor 'json-iterator/go\|jsoniter\.\|jsonIter\.\|fastJSON\.\|jsonAPI' .; then
            exit 1
          fi
          if grep -q 'github.com/json-iterator/go' go.mod; then
            echo 'jsoniter remains a module dependency' >&2
            exit 1
          fi

      - name: Run short test suite
        run: go test -short ./...

      - name: Commit tested migration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-stdlib-json.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor: use encoding/json standard library'
          git push origin HEAD:feature/stdlib-encoding-json
