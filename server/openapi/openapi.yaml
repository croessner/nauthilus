      security:
        - backchannelBasic: []
        - backchannelBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheFlushRequest"
      responses:
        "200":
          description: Cache flush result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheFlushResult"
        "400":
          $ref: "#/components/responses/JSONValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/cache/flush/async:
    delete:
      tags:
        - Cache
      operationId: enqueueUserCacheFlush
      summary: Enqueue an asynchronous user cache flush.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheFlushRequest"
      responses:
        "202":
          $ref: "#/components/responses/AsyncAccepted"
        "400":
          $ref: "#/components/responses/JSONValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/async/jobs/{jobId}:
    get:
      tags:
        - Async
      operationId: getAsyncJobStatus
      summary: Get the status of an asynchronous backchannel job.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Async job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/oidc/sessions/{user_id}:
    get:
      tags:
        - OIDCSessions
      operationId: listOIDCSessions
      summary: List active OIDC sessions for a user.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active sessions without raw token material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCSessions"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - OIDCSessions
      operationId: deleteOIDCSessions
      summary: Delete all OIDC sessions for a user.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: All sessions were deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/oidc/sessions/{user_id}/{token}:
    delete:
      tags:
        - OIDCSessions
      operationId: deleteOIDCSession
      summary: Delete one OIDC session for a user.
      security:
        - backchannelBasic: []
        - backchannelBearer: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session was deleted.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    policyBasic:
      type: http
      scheme: basic
      description: Dedicated Policy client credentials; never management Basic credentials.
    policyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Policy-resource Bearer token with nauthilus:policy_evaluate scope.
    backchannelBasic:
      type: http
      scheme: basic
      description: Backchannel Basic authentication.
    backchannelBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Backchannel OIDC bearer token. Some admin endpoints require security or admin scope.
  parameters:
    AuthMode:
      name: mode
      in: query
      required: false
      schema:
        type: string
        enum:
          - no-auth
          - list-accounts
      description: Optional authentication operation mode.
    InMemoryFlag:
      name: in-memory
      in: query
      required: false
      schema:
        type: string
        enum:
          - "0"
      description: Disable in-memory monitoring for this request when set to 0.
    CacheFlag:
      name: cache
      in: query
      required: false
      schema:
        type: string
        enum:
          - "0"
      description: Disable cache monitoring for this request when set to 0.
    AuthUserHeader:
      name: Auth-User
      in: header
      required: false
      schema:
        type: string
      description: Username header. Required for authentication unless mode is no-auth or list-accounts.
    AuthPassHeader:
      name: Auth-Pass
      in: header
      required: false
      schema:
        type: string
        format: password
      description: Password header. The configured header is removed from the request after it is read.
    AuthPasswordEncodedHeader:
      name: X-Auth-Password-Encoded
      in: header
      required: false
      schema:
        type: string
        enum:
          - "1"
      description: Set to 1 when Auth-Pass carries URL-safe base64 encoded password bytes.
    AuthProtocolHeader:
      name: Auth-Protocol
      in: header
      required: false
      schema:
        type: string
        enum:
          - smtp
          - imap
          - pop3
      description: Mail protocol of the upstream authentication attempt.
    AuthMethodHeader:
      name: Auth-Method
      in: header
      required: false
      schema:
        type: string
      description: Authentication mechanism such as LOGIN or PLAIN.
    AuthLoginAttemptHeader:
      name: Auth-Login-Attempt
      in: header
      required: false
      schema:
        type: integer
        minimum: 0
      description: One-based login attempt hint from the caller.
    ClientIPHeader:
      name: Client-IP
      in: header
      required: false
      schema:
        type: string
      description: Client source IP address.
    ClientPortHeader:
      name: X-Client-Port
      in: header
      required: false
      schema:
        type: string
      description: Client source TCP port.
    ClientIDHeader:
      name: X-Client-ID
      in: header
      required: false
      schema:
        type: string
      description: Optional upstream client identifier.
    ClientHostHeader:
      name: X-Client-Host
      in: header
      required: false
      schema:
        type: string
      description: Optional upstream client hostname.
    ExternalSessionIDHeader:
      name: X-External-Session-ID
      in: header
      required: false
      schema:
        type: string
      description: Optional upstream session correlation identifier.
    LocalIPHeader:
      name: X-Local-IP
      in: header
      required: false
      schema:
        type: string
      description: Local listener IP address.
    LocalPortHeader:
      name: X-Auth-Port
      in: header
      required: false
      schema:
        type: string
      description: Local listener TCP port.
    OIDCCIDHeader:
      name: X-OIDC-CID
      in: header
      required: false
      schema:
        type: string
      description: Optional OIDC client identifier associated with the request.
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Maximum number of records to return per brute-force list section.
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Zero-based offset for brute-force list paging.
    SSLHeader:
      name: X-SSL
      in: header
      required: false
      schema:
        type: string
      description: SSL/TLS state hint from the caller.
    SSLSessionIDHeader:
      name: X-SSL-Session-ID
      in: header
      required: false
      schema:
        type: string
      description: SSL session identifier.
    SSLClientVerifyHeader:
      name: X-SSL-Client-Verify
      in: header
      required: false
      schema:
        type: string
      description: Client certificate verification status.
    SSLClientDNHeader:
      name: X-SSL-Client-DN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate subject DN.
    SSLClientCNHeader:
      name: X-SSL-Client-CN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate common name.
    SSLIssuerHeader:
      name: X-SSL-Issuer
      in: header
      required: false
      schema:
        type: string
      description: Client certificate issuer.
    SSLClientNotBeforeHeader:
      name: X-SSL-Client-NotBefore
      in: header
      required: false
      schema:
        type: string
      description: Client certificate validity start.
    SSLClientNotAfterHeader:
      name: X-SSL-Client-NotAfter
      in: header
      required: false
      schema:
        type: string
      description: Client certificate validity end.
    SSLSubjectDNHeader:
      name: X-SSL-Subject-DN
      in: header
      required: false
      schema:
        type: string
      description: SSL subject distinguished name.
    SSLIssuerDNHeader:
      name: X-SSL-Issuer-DN
      in: header
      required: false
      schema:
        type: string
      description: SSL issuer distinguished name.
    SSLClientSubjectDNHeader:
      name: X-SSL-Client-Subject-DN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate subject distinguished name.
    SSLClientIssuerDNHeader:
      name: X-SSL-Client-Issuer-DN
      in: header
      required: false
      schema:
        type: string
      description: Client certificate issuer distinguished name.
    SSLCipherHeader:
      name: X-SSL-Cipher
      in: header
      required: false
      schema:
        type: string
      description: TLS cipher suite.
    SSLProtocolHeader:
      name: X-SSL-Protocol
      in: header
      required: false
      schema:
        type: string
      description: TLS protocol version.
    SSLSerialHeader:
      name: Auth-SSL-Serial
      in: header
      required: false
      schema:
        type: string
      description: Client certificate serial number.
    SSLFingerprintHeader:
      name: Auth-SSL-Fingerprint
      in: header
      required: false
      schema:
        type: string
      description: Client certificate fingerprint.
  responses:
    PolicyDecision:
      description: Completed Policy evaluation, including an indeterminate effect when safe to construct.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyDecisionResponse"
    PolicyBadRequest:
      description: Strict JSON or public-field validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyForbidden:
      description: The authenticated Policy caller is not admitted for this request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyRequestTooLarge:
      description: The request or a submitted value exceeded an admitted limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyRateLimited:
      description: The admitted client exceeded concurrency or rate limits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyUnauthorized:
      description: Policy credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyUnsupportedMediaType:
      description: The Policy endpoint accepts application/json only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    PolicyUnavailable:
      description: The Policy service was unavailable before evaluation began.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyError"
    AuthHeaderFailure:
      description: Header-mode authentication failure. The response body is JSON null; Auth-Status carries the status message.
      headers:
        Auth-Status:
          schema:
            type: string
        Auth-Wait:
          schema:
            type: string
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: "null"
    AuthHeaderSuccess:
      description: >
        Header-mode authentication result. Successful requests return headers
        such as Auth-Status, Auth-User, X-Nauthilus-Session, and dynamic
        X-Nauthilus-* attribute headers.
      headers:
        Auth-Status:
          schema:
            type: string
        Auth-User:
          schema:
            type: string
        X-Nauthilus-Memory-Cache:
          schema:
            type: string
            enum:
              - Hit
              - Miss
        X-Nauthilus-Session:
          schema:
            type: string
    AuthNginxResult:
      description: >
        NGINX auth_http result. HTTP status is 200 for both success and
        authentication failure; Auth-Status carries OK or the failure message.
      headers:
        Auth-Status:
          schema:
            type: string
        Auth-User:
          schema:
            type: string
        Auth-Server:
          schema:
            type: string
        Auth-Port:
          schema:
            type: string
        Auth-Wait:
          schema:
            type: string
        Auth-Error-Code:
          schema:
            type: string
        X-Nauthilus-Memory-Cache:
          schema:
            type: string
            enum:
              - Hit
              - Miss
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: "null"
    AuthJSONSuccess:
      description: Authentication result, account list, or no-auth result.
      headers:
        Auth-Status:
          schema:
            type: string
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthSuccess"
              - $ref: "#/components/schemas/AuthError"
              - $ref: "#/components/schemas/AccountList"
        text/plain:
          schema:
            type: string
        application/x-www-form-urlencoded:
          schema:
            type: string
    AuthCBORSuccess:
      description: Authentication result, account list, or no-auth result.
      headers:
        Auth-Status:
          schema:
            type: string
        X-Nauthilus-Session:
          schema:
            type: string
      content:
        application/cbor:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthSuccess"
              - $ref: "#/components/schemas/AuthError"
              - $ref: "#/components/schemas/AccountList"
        application/json:
          schema:
            $ref: "#/components/schemas/AccountList"
        text/plain:
          schema:
            type: string
        application/x-www-form-urlencoded:
          schema:
            type: string
    AsyncAccepted:
      description: Async job was queued.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncAcceptedResult"
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Request is authenticated but lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    JSONValidationError:
      description: Invalid JSON or request validation failure.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/FieldErrorResponse"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Requested or submitted media type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReputationAllocationRequest:
      oneOf:
        - type: "object"
          additionalProperties: false
          required:
            - "action"
          properties:
            action:
              type: "string"
              enum:
                - "status"
        - type: "object"
          additionalProperties: false
          required:
            - "action"
            - "reason"
            - "origin"
            - "audit_id"
          properties:
            action:
              type: "string"
              enum:
                - "drain"
            reason:
              type: "string"
              minLength: 1
              maxLength: 64
              pattern: "^[a-z][a-z0-9_.-]{0,63}$"
            origin:
              type: "string"
              minLength: 1
              maxLength: 64
              pattern: "^[a-z][a-z0-9_.-]{0,63}$"
            audit_id:
              type: "string"
              minLength: 1
              maxLength: 128
    ReputationAllocationView:
      type: "object"
      additionalProperties: false
      required:
        - "mode"
        - "generation"
        - "next_generation"
        - "fenced_shards"
        - "drained_at"
        - "retention"
        - "observed_at"
      properties:
        mode:
          type: "string"
          enum:
            - "active"
            - "draining"
        generation:
          type: "integer"
          minimum: 0
          maximum: 1000000
        next_generation:
          type: "integer"
          minimum: 1
          maximum: 1000001
        fenced_shards:
          type: "integer"
          minimum: 0
          maximum: 16
        drained_at:
