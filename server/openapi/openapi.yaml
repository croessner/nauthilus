openapi: 3.1.0
info:
  title: Nauthilus Management API
  version: v1
  description: >
    Contract for the stable protected machine-facing HTTP API subset. Dynamic
    custom hook aliases remain runtime configuration. Public IdP protocol and
    browser routes are documented by the public IdP contract.
servers:
  - url: "{baseUrl}"
    description: Nauthilus deployment base URL.
    variables:
      baseUrl:
        default: https://nauthilus.example.com
        description: Absolute base URL of the Nauthilus deployment to call.
tags:
  - name: OpenAPI
    x-displayName: /api/v1/openapi
    description: Embedded API contract documents.
  - name: Authentication
    x-displayName: /api/v1/auth
    description: Structured authentication and account listing endpoints.
  - name: BruteForce
    x-displayName: /api/v1/bruteforce
    description: Backchannel brute-force administration endpoints.
  - name: Cache
    x-displayName: /api/v1/cache
    description: Backchannel cache administration endpoints.
  - name: Config
    x-displayName: /api/v1/config
    description: Backchannel configuration inspection endpoint.
  - name: Async
    x-displayName: /api/v1/async
    description: Asynchronous backchannel job status endpoint.
  - name: MFA
    x-displayName: /api/v1/mfa
    description: Session-bound MFA management endpoints.
  - name: OIDCSessions
    x-displayName: /api/v1/oidc/sessions
    description: Backchannel OIDC session administration endpoints.
  - name: Policy
    x-displayName: /api/v1/policy/decisions
    description: Unary Policy decision evaluation endpoint.
  - name: Reputation
    x-displayName: /api/v1/custom/reputation
    description: Optional authenticated native reputation administration.
paths:
  "/api/v1/custom/reputation/allocation":
    post:
      tags:
        - "Reputation"
      operationId: "manageReputationAllocation"
      summary: "Inspect or fence the current allocation generation."
      description: "Requires backchannel bearer nauthilus:admin. Status reads the primary and all 16 shard fences without mutation. Drain requires audit fields and fences writers before starting the retained maximum event lifetime. Retry uses the identical audit fields and actor; a different in-progress change conflicts. After a process restart, allocation_maintenance must be explicitly enabled with the original key and generation to retain administration without activating writers. Status and retry remain available while writers are unready. Do not rotate before every shard is fenced and observed_at is at least drained_at plus retention. This API never changes keys, generations, retention or learned evidence."
      security:
        - backchannelBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReputationAllocationRequest"
      responses:
        200:
          description: "Verified current generation, shard fences and optional durable operator receipt."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationAllocationView"
        400:
          description: "Invalid or duplicate fields, unsupported subject, or query parameters."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        401:
          description: "Missing or invalid backchannel access token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        403:
          description: "Administrative authority or suitable authenticated actor missing."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        404:
          description: "Reputation plugin or custom hook surface unavailable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        409:
          description: "Selected override revision changed; read current state before retrying."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        413:
          description: "Body exceeds 4096 bytes."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        415:
          description: "Expected application/json."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        500:
          description: "Host execution failed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        503:
          description: "Primary state or verified readback unavailable; a mutation outcome may be unknown."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        504:
          description: "Management timeout; inspect current state before retrying."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
  "/api/v1/custom/reputation/lookup":
    post:
      tags:
        - "Reputation"
      operationId: "lookupReputation"
      summary: "Inspect one exact reputation subject."
      description: "Optional native reputation management endpoint. Requires a backchannel access token with nauthilus:admin, even when additional hook scopes are configured. Subjects are accepted only in the JSON body; enumeration and query parameters are prohibited. Actor identity is host-derived and cannot be supplied in the body. Reads use primary Redis and conservative active/previous key merging. Override changes target one named slot; they do not erase other slots or learned evidence. The latest per-slot operator receipt is retained for 90 days; this is not a complete audit history."
      security:
        - backchannelBearer: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReputationLookupRequest"
      responses:
        200:
          description: "Sanitized primary-backed state. Mutation success includes the independently verified change receipt."
          headers:
            "Cache-Control":
              schema:
                type: "string"
                const: "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationView"
        400:
          description: "Invalid or duplicate fields, unsupported subject, or query parameters."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        401:
          description: "Missing or invalid backchannel access token."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        403:
          description: "Administrative authority or suitable authenticated actor missing."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        404:
          description: "Reputation plugin or custom hook surface unavailable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        409:
          description: "Selected override revision changed; read current state before retrying."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        413:
          description: "Body exceeds 4096 bytes."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        415:
          description: "Expected application/json."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        500:
          description: "Host execution failed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        503:
          description: "Primary state or verified readback unavailable; a mutation outcome may be unknown."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
        504:
          description: "Management timeout; inspect current state before retrying."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ReputationManagementError"
  "/api/v1/custom/reputation/override":
    put:
      tags:
        - "Reputation"
      operationId: "putReputationOverride"
      summary: "Create or replace one audited operator override."
      description: "Optional native reputation management endpoint. Requires a backchannel access token with nauthilus:admin, even when additional hook scopes are configured. Subjects are accepted only in the JSON body; enumeration and query parameters are prohibited. Actor identity is host-derived and cannot be supplied in the body. Reads use primary Redis and conservative active/previous key merging. Override changes target one named slot; they do not erase other slots or learned evidence. The latest per-slot operator receipt is retained for 90 days; this is not a complete audit history."
      security:
