    OIDCSessionSummary:
      type: object
      required:
        - id
        - client_id
        - user_id
        - auth_time
      properties:
        id:
          type: string
          description: Stable non-secret session identifier derived from the stored token.
        client_id:
          type: string
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        redirect_uri:
          type: string
        mfa_method:
          type: string
        scopes:
          type: array
          items:
            type: string
        auth_time:
          type: string
          format: date-time
        mfa_completed:
          type: boolean
    PageInfo:
      type: object
      required:
        - limit
        - offset
        - next_offset
        - has_more
      properties:
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: integer
        has_more:
          type: boolean
    ResultEnvelope:
      type: object
      required:
        - session
        - object
        - operation
        - result
      properties:
        session:
          type: string
        object:
          type: string
        operation:
          type: string
        result: {}
