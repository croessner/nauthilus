# Composition fragment: merge modules, target bindings, providers, schema facts and checkpoint providers by identity.
# Keep the reputation model/source/key configuration and the verifier target and guards from their base examples.
# This fragment does not add Policy decisions. Identity contracts are empty until explicitly configured.
# The authentication target must use a distinct reputation component name because components own one namespace.
plugins:
    modules:
        - config:
            asn_database_path: /var/lib/GeoIP/GeoLite2-ASN.mmdb
            database_path: /var/lib/GeoIP/GeoLite2-City.mmdb
            decision_bindings:
                - component: smtp_peer
                  input:
                    category: environment
                    fact: environment.rspamd.smtp_client_ip
                  output_schema: geoip.facts.v1
                  targets:
                    - dkim2/accept-message-instance
            freshness:
                max_age: 1080h
                max_stale_age: 2160h
          name: geoip
          path: /usr/lib/nauthilus/plugins/geoip.so
          type: go
        - config:
            target_bindings:
                - component: assessment
                  decision_profile: operational
                  output_fact: dkim2_subjects
                  subjects:
                    - attribute: resource.dkim2.chain
                      category: resource
                      correlation_fields:
                        - sequence
                        - message_instance
                        - hop_binding
                        - signer_domain
                      correlation_types:
                        hop_binding: bytes
                        message_instance: integer
                        sequence: integer
                        signer_domain: string
                      field: signer_domain
                      kind: dns_domain
                      role: signer
                    - attribute: environment.rspamd.smtp_client_ip
                      category: environment
                      kind: ip
                      role: smtp_peer_ip
                    - attribute: environment.rspamd.smtp_client_ip
                      category: environment
                      derive: network_from_ip
                      kind: network
                      role: smtp_peer_network
                    - attribute: plugin.geoip.asn
                      category: environment
                      input_kind: integer
                      kind: asn
                      optional: true
                      provider: dkim2/plugin.geoip.smtp_peer
                      role: smtp_peer_asn
                  target: dkim2/accept-message-instance
          name: reputation
        - config:
            decision_profile: operational
            geoip_provider: dkim2/plugin.geoip.smtp_peer
            identity_contracts: []
            reputation_fact: plugin.reputation.dkim2_subjects
            reputation_provider: dkim2/plugin.reputation.assessment
          name: dkim2_intelligence
          path: /usr/lib/nauthilus/plugins/dkim2-intelligence.so
          type: go
policy:
    namespaces:
        dkim2:
            domain_plans:
                verifier:
                    checkpoints:
                        final_decision:
                            providers:
                                - name: smtp_peer
                                  skip_if:
                                    - nonpass_verifier_state
                                  use: dkim2/plugin.geoip.smtp_peer
                                - name: reputation_assessment
                                  skip_if:
                                    - nonpass_verifier_state
                                  use: dkim2/plugin.reputation.assessment
                                - name: intelligence_assessment
                                  skip_if:
                                    - nonpass_verifier_state
                                  use: dkim2/plugin.dkim2_intelligence.assessment
            providers:
                intelligence_assessment:
                    component: assessment
                    failure: indeterminate
                    kind: native
                    module: dkim2_intelligence
                    produced_facts:
                        - plugin.dkim2_intelligence.assessed_chain
                        - plugin.dkim2_intelligence.smtp_peer
                        - plugin.dkim2_intelligence.assessment_complete
                    requires:
                        - dkim2/plugin.reputation.assessment
                        - dkim2/plugin.geoip.smtp_peer
                    targets:
                        - action: accept-message-instance
                    timeout: 400ms
                reputation_assessment:
                    component: assessment
                    failure: indeterminate
                    kind: native
                    module: reputation
                    produced_facts:
                        - plugin.reputation.dkim2_subjects
                        - plugin.reputation.dkim2_subjects_fast
                        - plugin.reputation.dkim2_subjects_operational
                        - plugin.reputation.dkim2_subjects_baseline
                    requires:
                        - dkim2/plugin.geoip.smtp_peer
                    targets:
                        - action: accept-message-instance
                    timeout: 400ms
                smtp_peer:
                    component: smtp_peer
                    failure: indeterminate
                    kind: native
                    module: geoip
                    produced_facts:
                        - plugin.geoip.lookup_state
                        - plugin.geoip.ip
                        - plugin.geoip.network
                        - plugin.geoip.country_iso
                        - plugin.geoip.country_name
                        - plugin.geoip.city_name
                        - plugin.geoip.asn_org
                        - plugin.geoip.asn_prefix
                        - plugin.geoip.asn_registry
                        - plugin.geoip.asn_country_iso
                        - plugin.geoip.asn_allocated
                        - plugin.geoip.asn_status
                        - plugin.geoip.privacy_lookup_state
                        - plugin.geoip.privacy_primary_class
                        - plugin.geoip.data_age_seconds
                        - plugin.geoip.asn
                        - plugin.geoip.data_stale
                        - plugin.geoip.matched
                        - plugin.geoip.privacy_detected
                        - plugin.geoip.privacy_data_stale
                        - plugin.geoip.is_tor_exit_node
                        - plugin.geoip.is_known_vpn_exit
                        - plugin.geoip.is_community_vpn_exit
                        - plugin.geoip.is_public_proxy
                        - plugin.geoip.is_privacy_relay
                        - plugin.geoip.is_hosting_network
                        - plugin.geoip.is_shared_egress
                        - plugin.geoip.privacy_confidence
                        - plugin.geoip.privacy_data_age_seconds
                        - plugin.geoip.privacy_classes
                        - plugin.geoip.privacy_source_authorities
                    targets:
                        - action: accept-message-instance
                    timeout: 400ms
            schema_contributions:
                static:
                    accept-message-instance:
