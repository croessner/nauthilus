# Module composition fragment: merge modules and reputation target bindings by exact identity.
# Keep model/source/key configuration from go_plugin_reputation.yml and the complete Policy from policy_dkim2_rspamd_verifier.yml.
# No provider identity is inferred: configure explicit identity contracts before enabling enforcement.
plugins:
    modules:
        - config:
            asn_database_path: /var/lib/GeoIP/GeoLite2-ASN.mmdb
            database_path: /var/lib/GeoIP/GeoLite2-City.mmdb
            decision_bindings:
                - component: smtp_peer
                  input:
                    category: environment
                    fact: environment.rspamd.smtp_client_ip
                  output_schema: geoip.facts.v1
                  targets:
                    - dkim2/accept-message-instance
            freshness:
                max_age: 1080h
                max_stale_age: 2160h
          name: geoip
          path: /usr/lib/nauthilus/plugins/geoip.so
          type: go
        - config:
            target_bindings:
                - component: assessment
                  decision_profile: operational
                  output_fact: dkim2_subjects
                  subjects:
                    - attribute: resource.dkim2.chain
                      category: resource
                      correlation_fields:
                        - sequence
                        - message_instance
                        - hop_binding
                        - signer_domain
                      correlation_types:
                        hop_binding: bytes
                        message_instance: integer
                        sequence: integer
                        signer_domain: string
                      field: signer_domain
                      kind: dns_domain
                      role: signer
                    - attribute: environment.rspamd.smtp_client_ip
                      category: environment
                      kind: ip
                      role: smtp_peer_ip
                    - attribute: environment.rspamd.smtp_client_ip
                      category: environment
                      derive: network_from_ip
                      kind: network
                      role: smtp_peer_network
                    - attribute: plugin.geoip.asn
                      category: environment
                      input_kind: integer
                      kind: asn
                      optional: true
                      provider: dkim2/plugin.geoip.smtp_peer
                      role: smtp_peer_asn
                  target: dkim2/accept-message-instance
          name: reputation
        - config:
            decision_profile: operational
            geoip_provider: dkim2/plugin.geoip.smtp_peer
            identity_contracts: []
            reputation_fact: plugin.reputation.dkim2_subjects
            reputation_provider: dkim2/plugin.reputation.assessment
          name: dkim2_intelligence
          path: /usr/lib/nauthilus/plugins/dkim2-intelligence.so
          type: go
