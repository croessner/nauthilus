# Optional native plugin used for non-critical enrichment.
plugins:
  verification_policy: when_present
  allowed_dirs:
    - /usr/lib/nauthilus/plugins
  modules:
    - name: geoip
      type: go
      path: /usr/lib/nauthilus/plugins/geoip.so
      checksum: sha256:replace-with-artifact-sha256
      optional: true
      config:
        decision_bindings:
          - component: environment
            targets: [authn/authenticate, authn/lookup_identity]
            input: {fact: input.auth.client_ip, category: environment}
            output_schema: geoip.facts.v1
        database_path: /var/lib/nauthilus/geoip.json
