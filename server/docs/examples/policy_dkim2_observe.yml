# Consumer-calibration companion for policy_dkim2_rspamd_verifier.yml.
# Merge this exact namespace/action target by identity, preserving its schema,
# domain plan, rules, no_match and timeouts. This is not a standalone config.
# Generic Policy targets compute proposals in enforce mode. Set the Rspamd
# dkim2.nauthilus.mode setting to observe to log proposals without applying
# them to delivery. This consumer target must have no reachable effects.
# The separate reputation/observe ingestion target also stays in enforce mode
# so its acknowledged storage effect executes. Its delivery remains mandatory.
policy:
  targets:
    - namespace: dkim2
      action: accept-message-instance
      mode: enforce
