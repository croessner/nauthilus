      description: >-
        Requires nauthilus:operations_read. Filters are accepted only in the JSON body; query parameters are refused.
        HTTP 200 means the call was processed; `source` states the completeness of the log source and `page` the page
        size the source allowed. Every event carries its timestamp, instance, stream labels, and every field of the log
        line complete; only authentication secrets (passwords, tokens, keys, cookies, authorization values) are replaced
        by `<redacted>` and named in `redacted_fields`. Nothing is changed.
      security:
        - backchannelBearer: []
        - backchannelBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportOperationsLogEventsRequest"
