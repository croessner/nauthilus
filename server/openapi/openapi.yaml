          description: >-
            Stable result code. effect_outcome_unknown is non-retryable.
            effect_replay_unsafe is non-retryable because an earlier non-idempotent
            effect already completed or was accepted before a later failure.
            effect_outcome_unknown_replay_safe permits retrying the complete Policy
