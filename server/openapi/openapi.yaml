        - SupportHistory
      operationId: searchAuthenticationAttempts
      summary: Search the recorded authentication attempts of one subject in a bounded window.
      description: >-
        Requires nauthilus:history_read. Filters are accepted only in the JSON body; query parameters are refused.
        HTTP 200 means the query was processed; `history` states which evidence was readable and `result_basis`
        the match state. An empty `attempts` list never proves that no login happened. Attempts are ordered by
        their latest subject-matching activity, newest first; pages carry no snapshot isolation, so clients
        deduplicate by attempt_id.
      security:
        - backchannelBearer: []
        - backchannelBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportHistoryAttemptSearchRequest"
      responses:
        "200":
          description: Processed search; evidence may be partial.
          headers:
