# Native Have I Been Pwned post-action plugin.
#
# The bundled Docker images provide:
#   /usr/local/lib/nauthilus/plugins/haveibeenpwnd.so
#   /usr/local/lib/nauthilus/plugins/haveibeenpwnd.so.minisig
#
# This module registers the authentication-shaped `PostActionTarget` only. The
# authn generation exposes the exact Policy effect
# `authn/plugin.haveibeenpwnd.post_action`; it does not expose a generic
# `DecisionEffectProvider` to any other target namespace. The
# module must allow the `credentials` capability. If config.mail.enabled is
# true, also allow `mail` before restart.

plugins:
  verification_policy: signature_required
  allowed_dirs:
    - /usr/local/lib/nauthilus/plugins
  trust:
    signers:
      - id: nauthilus-plugin-build-key-2026
        format: minisign
        public_key_file: /usr/share/nauthilus/plugin-keys/build-2026.pub
  modules:
    - name: haveibeenpwnd
      type: go
      path: /usr/local/lib/nauthilus/plugins/haveibeenpwnd.so
      signature: minisign:/usr/local/lib/nauthilus/plugins/haveibeenpwnd.so.minisig
      signer: nauthilus-plugin-build-key-2026
      optional: false
      allow_capabilities:
        - credentials
        # Required when config.mail.enabled is true.
        # - mail
      config:
        redis_pool: default
        api_base_url: https://api.pwnedpasswords.com/range/
        http_timeout: 10s
        http_max_response_bytes: 1048576
        cache_positive_ttl: 1h
        cache_negative_ttl: 10m
        redis_positive_ttl: 1h
        redis_negative_ttl: 24h
        gate_ttl: 5m
        mail:
          # Set to true only after the module is allowed to use the `mail`
          # capability and the relay settings below are valid for this host.
          enabled: false
          use_lmtp: false
          server: localhost
          port: 25
          helo_name: localhost
          tls: false
          starttls: false
          username: ""
          password: ""
          mail_from: postmaster@example.invalid
          website: https://self-service.example.invalid/
          template_path: ""
          subject_template: "Password leak detected for your account <{{ .Account }}>"

policy:
  namespaces:
    authn:
      domain_plans:
        haveibeenpwnd_post_action:
          checkpoints:
            pre_auth:
              providers:
                - name: brute_force
                  use: authn/builtin/brute_force
                  actions: [authenticate]
            auth_backend:
              providers:
                # Replace this binding when authentication uses another backend.
                - name: ldap_backend
                  use: authn/builtin/ldap_backend
                  actions: [authenticate]
            auth_decision:
              providers: []
      policy_sets:
        haveibeenpwnd_post_action:
          rules:
            - name: inspect_successful_authentication
              checkpoint: auth_decision
              actions: [authenticate]
              if:
                attribute: backend.authenticated
                is: true
              then:
                decision: permit
                obligations:
                  - id: authn/plugin.haveibeenpwnd.post_action
  targets:
    - namespace: authn
      action: authenticate
      schema: authn/authenticate/v1
      domain_plan: authn/haveibeenpwnd_post_action
      default_policy: authn/standard_auth
      plans:
        auth_decision:
          policy_sets: [authn/haveibeenpwnd_post_action]
