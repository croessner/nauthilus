name: Govulncheck Main Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: runtimesecret
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.27.4
          check-latest: true

      - name: Install govulncheck
        run: GOFLAGS=-mod=mod go install "golang.org/x/vuln/cmd/govulncheck@v$(make -s print-govulncheck-version)"

      # The Makefile owns the scanned package set, including documented maintainer exceptions.
      - name: Run govulncheck
        run: make govulncheck
