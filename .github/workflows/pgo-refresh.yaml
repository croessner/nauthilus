name: PGO Profile Refresh

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time: two runs would race for the same fast-forward of features.
concurrency:
  group: pgo-refresh
  cancel-in-progress: false

env:
  GOEXPERIMENT: runtimesecret

jobs:
  refresh-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profiled revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.27.4
          check-latest: true

      - name: Install browser E2E dependencies
        run: |
          npm ci --prefix contrib/identity-proxy-e2e
          npx --prefix contrib/identity-proxy-e2e playwright install --with-deps chromium

      # The runner profiles a dedicated authentication workload after the release checks and refuses a candidate
      # without enough CPU samples to describe a hot path.
      - name: Capture PGO candidate from release E2E
        run: make release-identity-proxy-e2e

      - name: Validate PGO candidate
        run: |
          test -s contrib/identity-proxy-e2e/.work/pgo/candidate.pgo
          go tool pprof -top contrib/identity-proxy-e2e/.work/pgo/candidate.pgo >/dev/null

      - name: Upload PGO candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pgo-candidate
          path: contrib/identity-proxy-e2e/.work/pgo/candidate.pgo
          if-no-files-found: error

      # The profile is committed to features directly: it changes optimization only, it is validated below, and the
      # next release merges it into main. A pull request would need the repository to let GitHub Actions create pull
      # requests and would not start the regular workflows.
      - name: Commit the profile to features
        shell: bash
        run: |
          set -euo pipefail

          cp contrib/identity-proxy-e2e/.work/pgo/candidate.pgo "${RUNNER_TEMP}/default.pgo"

          git fetch origin features
          git checkout -B pgo-refresh origin/features
          cp "${RUNNER_TEMP}/default.pgo" server/default.pgo

          # Prove that the next server build and its native plugins consume the profile together.
          go build -mod=vendor -trimpath -o "${RUNNER_TEMP}/nauthilus-pgo" ./server
          sh scripts/check-native-artifact-bundle.sh

          if git ls-files --error-unmatch server/default.pgo >/dev/null 2>&1 && \
             git diff --quiet -- server/default.pgo; then
            echo "The committed PGO profile already matches the candidate."
            exit 0
          fi

          samples="$(go tool pprof -sample_index=samples -top -nodecount=1 server/default.pgo |
            sed -n 's/.*Total samples = \([0-9][0-9]*\).*/\1/p')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/default.pgo
          git commit -F - <<EOF
          Build: Refresh the PGO profile from ${GITHUB_REF_NAME}

          - Merged CPU profile of the release identity-proxy E2E authentication workload (${samples} samples).
          - Validated with go tool pprof, a PGO server build, and the native plugin bundle check.
          - Server and native plugin builds share it through scripts/native-pgo-flag.sh.
          EOF

          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/features; then
              exit 0
            fi

            echo "Push attempt ${attempt} was rejected; rebasing onto the current features branch."
            git fetch origin features
            git rebase origin/features
          done

          echo "::error::The PGO profile could not be pushed to features."
          exit 1
